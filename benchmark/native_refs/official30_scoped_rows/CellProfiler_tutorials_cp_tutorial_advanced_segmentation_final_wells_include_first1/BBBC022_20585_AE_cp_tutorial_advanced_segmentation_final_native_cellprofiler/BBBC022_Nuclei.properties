# ==== Image Path and File Name Columns ====
# Classifier needs to know where to find the images from your experiment.
# Specify the column names from your per-image table that contain the image
# paths and file names here.
#
# Individual image files are expected to be monochromatic and represent a single
# channel. However, any number of images may be combined by adding a new channel
# path and filename column to the per-image table of your database and then
# adding those column names here.
#
# Note that these lists must have equal length!
image_path_cols = Image_PathName_OrigHoechst,Image_PathName_OrigER,Image_PathName_OrigSyto,Image_PathName_OrigPh_golgi,Image_PathName_OrigMito,Image_PathName_IllumMito,Image_PathName_IllumPh_golgi,Image_PathName_IllumSyto,Image_PathName_IllumER,Image_PathName_IllumHoechst
image_file_cols = Image_FileName_OrigHoechst,Image_FileName_OrigER,Image_FileName_OrigSyto,Image_FileName_OrigPh_golgi,Image_FileName_OrigMito,Image_FileName_IllumMito,Image_FileName_IllumPh_golgi,Image_FileName_IllumSyto,Image_FileName_IllumER,Image_FileName_IllumHoechst


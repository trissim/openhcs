<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Representation fibers and confusability graph</title>
  <desc id="desc">Five classes map through a representation. A and B share the same representation 000, forming a collision fiber of size 2 and a two-node clique in the confusability graph. C, D, and E are singleton fibers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e6b73" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.10" />
    </filter>
    <style>
      .bg { fill: #fcfaf6; }
      .panel { fill: #ffffff; stroke: #d9d2c3; stroke-width: 1.5; rx: 20; filter: url(#shadow); }
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #22313f; }
      .subtitle { font: 600 18px Georgia, 'Times New Roman', serif; fill: #37515f; }
      .body { font: 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #31424d; }
      .small { font: 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #56656e; }
      .classNode { fill: #2c6e73; }
      .fiberBox { fill: #eef4f5; stroke: #90a9ad; stroke-width: 1.5; }
      .fiberHot { fill: #fff1e6; stroke: #d28549; stroke-width: 2; }
      .graphBox { fill: #fbfcfd; stroke: #c9d3d7; stroke-width: 1.25; }
      .edge { stroke: #d28549; stroke-width: 4; stroke-linecap: round; }
      .arrow { stroke: #5e6b73; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .orange { fill: #d28549; }
      .teal { fill: #2c6e73; }
      .badge { fill: #d28549; }
      .badgeText { font: 700 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="640" />
  <text class="title" x="60" y="62">Running example: representation fibers, A_pi, and the confusability graph</text>

  <rect class="panel" x="40" y="92" width="290" height="452" />
  <rect class="panel" x="360" y="92" width="330" height="452" />
  <rect class="panel" x="720" y="92" width="440" height="452" />

  <text class="subtitle" x="70" y="130">1. Classes</text>
  <text class="subtitle" x="390" y="130">2. Representation fibers</text>
  <text class="subtitle" x="750" y="130">3. Confusability graph</text>

  <g transform="translate(0,0)">
    <circle class="classNode" cx="120" cy="190" r="24" />
    <circle class="classNode" cx="120" cy="265" r="24" />
    <circle class="classNode" cx="120" cy="340" r="24" />
    <circle class="classNode" cx="120" cy="415" r="24" />
    <circle class="classNode" cx="120" cy="490" r="24" />
    <text x="120" y="197" text-anchor="middle" class="body" fill="#ffffff">A</text>
    <text x="120" y="272" text-anchor="middle" class="body" fill="#ffffff">B</text>
    <text x="120" y="347" text-anchor="middle" class="body" fill="#ffffff">C</text>
    <text x="120" y="422" text-anchor="middle" class="body" fill="#ffffff">D</text>
    <text x="120" y="497" text-anchor="middle" class="body" fill="#ffffff">E</text>
    <text class="small" x="165" y="196">class A</text>
    <text class="small" x="165" y="271">class B</text>
    <text class="small" x="165" y="346">class C</text>
    <text class="small" x="165" y="421">class D</text>
    <text class="small" x="165" y="496">class E</text>
  </g>

  <g>
    <rect class="fiberHot" x="430" y="165" width="190" height="128" rx="20" />
    <rect class="fiberBox" x="430" y="322" width="190" height="56" rx="18" />
    <rect class="fiberBox" x="430" y="397" width="190" height="56" rx="18" />
    <rect class="fiberBox" x="430" y="472" width="190" height="56" rx="18" />

    <rect class="badge" x="507" y="147" width="90" height="28" rx="14" />
    <text class="badgeText" x="552" y="166" text-anchor="middle">size 2</text>

    <text class="body" x="525" y="215" text-anchor="middle">pi(A) = 000</text>
    <text class="body" x="525" y="248" text-anchor="middle">pi(B) = 000</text>
    <text class="body" x="525" y="357" text-anchor="middle">pi(C) = 100</text>
    <text class="body" x="525" y="432" text-anchor="middle">pi(D) = 110</text>
    <text class="body" x="525" y="507" text-anchor="middle">pi(E) = 111</text>
  </g>

  <path class="arrow" d="M 144 190 C 265 190, 320 190, 428 196" />
  <path class="arrow" d="M 144 265 C 265 265, 320 258, 428 262" />
  <path class="arrow" d="M 144 340 C 265 340, 320 344, 428 350" />
  <path class="arrow" d="M 144 415 C 265 415, 320 419, 428 425" />
  <path class="arrow" d="M 144 490 C 265 490, 320 494, 428 500" />

  <g>
    <rect x="770" y="164" width="164" height="118" rx="22" fill="#fff4ec" stroke="#e0b286" stroke-width="1.6" />
    <rect x="966" y="196" width="136" height="70" rx="18" class="graphBox" />
    <rect x="790" y="332" width="110" height="70" rx="18" class="graphBox" />
    <rect x="930" y="332" width="110" height="70" rx="18" class="graphBox" />
    <rect x="1070" y="332" width="110" height="70" rx="18" class="graphBox" />

    <text class="small" x="782" y="188">fiber 000</text>
    <text class="small" x="978" y="218">largest fiber</text>
    <text class="small" x="823" y="354">fiber 100</text>
    <text class="small" x="963" y="354">fiber 110</text>
    <text class="small" x="1103" y="354">fiber 111</text>

    <circle class="orange" cx="830" cy="226" r="22" />
    <circle class="orange" cx="874" cy="226" r="22" />
    <line class="edge" x1="830" y1="226" x2="874" y2="226" />
    <text x="830" y="232" text-anchor="middle" class="body" fill="#ffffff">A</text>
    <text x="874" y="232" text-anchor="middle" class="body" fill="#ffffff">B</text>

    <circle class="teal" cx="845" cy="367" r="22" />
    <circle class="teal" cx="985" cy="367" r="22" />
    <circle class="teal" cx="1125" cy="367" r="22" />
    <text x="845" y="373" text-anchor="middle" class="body" fill="#ffffff">C</text>
    <text x="985" y="373" text-anchor="middle" class="body" fill="#ffffff">D</text>
    <text x="1125" y="373" text-anchor="middle" class="body" fill="#ffffff">E</text>

    <text class="body" x="1034" y="241">A_pi = 2</text>
    <text class="small" x="984" y="258">largest clique size</text>
  </g>

  <rect x="60" y="566" width="1080" height="48" rx="22" fill="#eef4f5" stroke="#c8d7da" stroke-width="1.4" />
  <text class="body" x="600" y="597" text-anchor="middle">Each representation fiber becomes one clique. The largest fiber has size 2, so A_pi = 2 and any zero-error scheme needs at least log2(2) = 1 auxiliary bit.</text>
</svg>

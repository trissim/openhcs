[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py311"]

# NOTE: The OMERO extra declares omero-py, but ZeroC Ice is not installed
# automatically from project metadata. Install it first with
# scripts/install_omero_deps.py or requirements-omero.txt, then install the
# OpenHCS extra with `pip install -e ".[omero]"`.
#
# For more information, see:
# https://www.glencoesoftware.com/blog/2023/12/08/ice-binaries-for-omero.html

[project]
name = "openhcs"
dynamic = ["version"]
description = "High-Content Screening image processing engine with native GPU support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*"]
authors = [
    {name = "Tristan Simas", email = "tristan.simas@mail.mcgill.ca"}
]
keywords = [
    "microscopy",
    "image-processing",
    "high-content-screening",
    "gpu",
    "computer-vision"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Core dependencies
dependencies = [
    # Core image processing and scientific computing
    "numpy>=1.26.4",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.1",
    "scipy>=1.12.0",
    "PyWavelets>=1.6.0",
    "pandas>=2.3.1",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
    # Numba 0.63+ stopped publishing Intel macOS wheels. Keep that platform on
    # the newest wheel-backed line so desktop installs never compile LLVM.
    "numba>=0.61.0,<0.63; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "numba>=0.61.0; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "skan>=0.13.1",
    "threadpoolctl>=3.6.0",

    # Image I/O and formats
    "imageio>=2.37.0",
    "tifffile>=2025.6.11",
    "imagecodecs>=2025.3.30",
    # OpenHCS uses array-processing APIs only. The headless distribution avoids
    # installing a second Qt runtime and is shared with Multi-Template-Matching.
    # OpenCV 4.11+ raised its Intel wheel deployment target; 4.10 retains the
    # NumPy 2-compatible macOS 12 wheel needed by supported Intel desktops.
    "opencv-python-headless>=4.10.0.84,<4.11; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.11.0.86; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "Multi-Template-Matching>=2.0.1",
    "roifile>=2024.5.24",  # Required for ROI saving to disk

    # Storage and serialization
    "PyYAML>=6.0.2",
    "zarr>=2.18.7,<3.0",
    "ome-zarr>=0.11.1",
    "dill>=0.4.0",

    # Core utilities
    "setuptools",
    "packaging>=21.0",  # For version parsing (replaces deprecated pkg_resources)
    "watchdog>=6.0.0",
    "portalocker>=2.8.2",  # Cross-platform file locking (Windows compatibility for fcntl)
    "requests>=2.31.0",  # HTTP library for LLM service communication
    "tomlkit>=0.13.3",  # Preserve user-authored Codex MCP configuration on registration
    "tqdm>=4.66.5",

    # System monitoring (required by ui/shared/system_monitor_core.py)
    "psutil>=5.9.0",

    # External dependencies (PyPI versions for production builds)
    "zmqruntime>=0.2.3",
    "pycodify>=0.1.3",
    "objectstate>=1.1.3",
    "python-introspect>=0.1.10",
    "metaclass-registry>=0.2.0,<0.3",
    "arraybridge>=0.3.0",
    "polystore>=0.1.32",
    "pyqt-reactive>=0.2.12,<0.3",
]

[project.optional-dependencies]
# Development dependencies (CPU-only testing)
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.3.2",
    "genbadge[coverage]",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.5.0",  # File-isolated unit-test diagnostics (--dist loadfile)
    # MCP Python SDK v2 is still a breaking-development line; migrate explicitly after GA.
    "mcp>=1.28,<2",
    "pyzmq>=26.0.0",  # Required for ZMQ execution and OMERO integration tests
]

# GUI testing dependencies
dev-gui = [
    "pytest-qt>=4.2.0",
]

# CellProfiler compatibility/parity dependencies
cellprofiler-compat = [
    "centrosome>=1.3.3",
    "mahotas>=1.4.18",
    "matplotlib>=3.10.0",
]

# Terminal User Interface (TUI) - DEPRECATED, not available on PyPI
# TUI has external dependencies that require local development setup
# For development, use pip install -e ".[dev,gui]" (custom build backend handles it)

# PyQt6 Graphical User Interface (GUI) dependencies
gui = [
    "PyQt6>=6.9.1",
    "PyQt6-QScintilla>=2.14.1",
    "pyqtgraph>=0.13.7",  # Used for system monitor visualization
    "PyOpenGL>=3.1.7",  # GPU-accelerated flash overlay rendering (optional, auto-fallback to QPainter)
    "GPUtil>=1.4.0",
    "distinctipy>=1.2.2",  # Perceptually distinct colors for scope-based visuals
    "wcag-contrast-ratio>=0.9",  # Contrast checking for scope colors
    # plotext removed - PyQt GUI now uses pyqtgraph instead
    # psutil moved to core dependencies (required by ui/shared/system_monitor_core.py)
]

# Napari viewer
napari = [
    "napari>=0.7.1",
    "napari-crop>=0.1.12",
]

# Fiji/ImageJ integration
fiji = [
    "pyimagej>=1.4.1",
    "scyjava>=1.12.0",
]

# Model Context Protocol server
mcp = [
    # Keep release wheels on the tested stable major; do not float into MCP SDK v2.
    "mcp>=1.28,<2",
]

# Hosted Streamable HTTP MCP server (public read-only or OAuth-protected)
mcp-http = [
    "mcp>=1.28,<2",
    "httpx>=0.28,<1",
]

# Bio-Formats HCS reader integration
bioformats = [
    "pyimagej>=1.4.1",
    "scyjava>=1.12.0",
]

# All visualization tools (napari + fiji)
viz = [
    "napari>=0.7.1",
    "napari-crop>=0.1.12",
    "pyimagej>=1.4.1",
    "scyjava>=1.12.0",
]

# OMERO integration dependencies
#
# IMPORTANT: PyPI does not allow direct URL dependencies in project metadata.
# The zeroc-ice wheels required by omero-py must be installed via the helper script
# or requirements file instead of as an extra dependency here.
#
# Installation:
#   python scripts/install_omero_deps.py
#   # or
#   pip install -r requirements-omero.txt
#
# Alternative installation (using requirements file):
#   pip install -r requirements-omero.txt
#
# For more information, see:
#   - https://www.glencoesoftware.com/blog/2023/12/08/ice-binaries-for-omero.html
#   - scripts/install_omero_deps.py
#   - requirements-omero.txt
omero = [
    "omero-py>=5.19.0",
]

# Documentation dependencies
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-toolbox>=3.0.0",
    "sphinx-design>=0.5.0",
]

# Remote execution and OMERO integration
#
# IMPORTANT: PyPI does not allow direct URL dependencies in project metadata.
# Install zeroc-ice for OMERO using scripts/install_omero_deps.py or requirements-omero.txt.
#
# See the 'omero' optional dependency section above for more details.
remote = [
    "pyzmq>=26.0.0",  # ZMQ-based remote execution and streaming
    "omero-py>=5.19.0",  # OMERO Python bindings for OMERO backend
]

# GPU acceleration dependencies
gpu = [
    # PyTorch
    "torch>=2.6.0,<2.8.0",
    "torchvision>=0.21.0,<0.23.0",
    
    # JAX
    "jax>=0.5.3,<0.6.0",
    "jaxlib>=0.5.3,<0.6.0",
    
    # JAX CUDA plugins
    "jax-cuda12-pjrt>=0.5.3,<0.6.0",
    "jax-cuda12-plugin>=0.5.3,<0.6.0",
    
    # CuPy
    "cupy-cuda12x>=13.3.0,<14.0.0",
    
    # CuCIM
    "cucim-cu12>=25.6.0,<26.0.0",
    
    # TensorFlow
    "tensorflow>=2.19.0,<2.20.0",
    
    # TensorFlow Probability
    "tensorflow-probability[tf]>=0.25.0,<0.26.0",
    
    # pyclesperanto
    "pyclesperanto>=0.17.1",

    # torbi - GPU-accelerated Viterbi decoding (git dependency, install manually if needed)
    # "torbi @ git+https://github.com/OpenHCSDev/torbi.git",
]

# All non-dev extras combined (TUI excluded - deprecated)
all = [
    # GUI
    "PyQt6>=6.9.1",
    "PyQt6-QScintilla>=2.14.1",
    "pyqtgraph>=0.13.7",
    "GPUtil>=1.4.0",
    # plotext removed - PyQt GUI now uses pyqtgraph instead
    # psutil moved to core dependencies (required by ui/shared/system_monitor_core.py)

    # Viz
    "napari>=0.7.1",
    "napari-crop>=0.1.12",
    "pyimagej>=1.4.1",
    "scyjava>=1.12.0",

    # MCP
    # Keep this aligned with the dedicated mcp extra above.
    "mcp>=1.28,<2",
    "httpx>=0.28,<1",

    # GPU
    "torch>=2.6.0,<2.8.0",
    "torchvision>=0.21.0,<0.23.0",
    "jax>=0.5.3,<0.6.0",
    "jaxlib>=0.5.3,<0.6.0",
    "jax-cuda12-pjrt>=0.5.3,<0.6.0",
    "jax-cuda12-plugin>=0.5.3,<0.6.0",
    "cupy-cuda12x>=13.3.0,<14.0.0",
    "cucim-cu12>=25.6.0,<26.0.0",
    "tensorflow>=2.19.0,<2.20.0",
    "tensorflow-probability[tf]>=0.25.0,<0.26.0",
    "pyclesperanto>=0.17.1",
    # "torbi @ git+https://github.com/OpenHCSDev/torbi.git",  # Git dependency, install manually if needed
]

[project.urls]
Homepage = "https://openhcsdev.github.io/openhcs/"
"Bug Reports" = "https://github.com/OpenHCSDev/OpenHCS/issues"
Source = "https://github.com/OpenHCSDev/OpenHCS"
Documentation = "https://openhcs.readthedocs.io/"

[project.scripts]
# Main interfaces - the top-level dispatcher defaults to the GUI and exposes
# stable named commands such as `openhcs mcp` for package registries.
openhcs = "openhcs.cli:main"
# openhcs-tui = "openhcs.textual_tui.__main__:main"  # TUI deprecated, not in PyPI

# Utility scripts
openhcs-recache = "openhcs.utils.recache_function_registry:main"
openhcs-mcp = "openhcs.mcp.bootstrap:main"
openhcs-mcp-register = "openhcs.mcp.client_registration:main"
openhcs-mcp-http = "openhcs.mcp.http:main"
openhcs-mcp-dev = "openhcs.mcp.dev_client:main"
openhcs-mcp-demo = "openhcs.mcp.installed_demo:main"

[project.gui-scripts]
openhcs-gui = "openhcs.pyqt_gui.__main__:main"

[project.entry-points."napari.manifest"]
openhcs = "openhcs:napari.yaml"

[tool.setuptools]
# Automatically find all packages under openhcs/
zip-safe = false

[tool.setuptools.packages.find]
include = ["openhcs*"]
exclude = ["openhcs.textual_tui*", "openhcs.omero.plugin.build*"]

[tool.setuptools.dynamic]
version = {attr = "openhcs.__version__"}

[tool.setuptools.package-data]
openhcs = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "resources/assets/*.svg",
    "resources/assets/*.png",
    "resources/assets/*.ico",
    "resources/assets/*.icns",
    "resources/windows/*.cs",
    "omero/*",
    "omero/**/*",
    "agent/resources/knowledge/**/*.md",
    "agent/resources/knowledge/**/*.rst",
]

[tool.setuptools.exclude-package-data]
openhcs = ["omero/plugin/build/*", "omero/plugin/build/**/*"]

# GPU Dependencies Version Notes:
# - JAX 0.4.38: Last version compatible with CuDNN 9.5.x (JAX 0.5.0+ requires CuDNN 9.8+)
# - JAX CUDA plugins must exactly match JAX version for PJRT API compatibility
# - PyTorch 2.7.x: Compatible with CUDA 12.6 and CuDNN 9.5.x
# - TensorFlow 2.15-2.19: Stable DLPack support (2.12+ required for DLPack)
# - CuPy: Use cupy-cuda12x for broad CUDA 12.x compatibility (not cupy-cuda120)
# - CuCIM: PyPI cucim-cu12 package is incomplete (missing filters), use conda for full version
# - torbi: Using patched fork that fixes PyTorch 2.6+ CUDA compilation issues (py_limited_api)
#
# Installation Examples:
# - Base package only: pip install openhcs
# - With GUI: pip install "openhcs[gui]"
# - With GPU support: pip install "openhcs[gpu]"
# - Full installation: pip install "openhcs[all]"
#
# Integrated development installation requires explicitly installing the eight
# editable packages under external/ before `pip install -e ".[dev,gui]"`.
# setup.py does not replace the published dependency requirements automatically.
# See docs/development_setup.md for the exact commands.

[tool.coverage.run]
omit = [
    "openhcs/textual_tui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

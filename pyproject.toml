[project]
name = "dq_dock_engine"
version = "0.1.0"
description = "A high-performance JAX physics engine for molecular docking, verified by Lean 4."
authors = [
    { name = "OpenHCS Team", email = "team@openhcs.org" }
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.20.0",
    "dm-haiku>=0.0.9",
    "optax>=0.1.0",
    "chex>=0.1.5",
    "mdanalysis>=2.0.0",
    "rdkit>=2022.3.1",
    "meeko>=0.6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dq_dock_engine*"]

[project.scripts]
dq-dock = "dq_dock_engine.cli:main"

name: Published Release Canary

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Published OpenHCS version; blank selects the latest stable release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  installed-gui-startup:
    name: installed-gui-live-mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout smoke authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            openhcs/__init__.py
            packaging/codex/openhcs/.mcp.json
            packaging/mcpb/openhcs/pyproject.toml
            pyproject.toml
            scripts/smoke_installed_gui.py
            scripts/sync_mcp_release_metadata.py
            server.json
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa

      - name: Install the published desktop package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --upgrade pip packaging
          desktop_extras=$(python scripts/sync_mcp_release_metadata.py --print-desktop-extras)
          package_requirement="openhcs[${desktop_extras}]"
          if [ -n "$REQUESTED_VERSION" ]; then
            package_requirement="${package_requirement}==${REQUESTED_VERSION}"
          fi
          python -m pip install "$package_requirement"
          python -m pip check
          python -c "from importlib.metadata import version; print('Installed OpenHCS ' + version('openhcs'))"

      - name: Operate the installed GUI through packaged MCP
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          XDG_CACHE_HOME: ${{ runner.temp }}/openhcs-published-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/openhcs-published-config
          XDG_DATA_HOME: ${{ runner.temp }}/openhcs-published-data
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          mkdir -p "$RUNNER_TEMP/openhcs-published-gui-evidence"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_gui.py" \
            --forbid-import-root "$GITHUB_WORKSPACE" \
            --evidence-directory "$RUNNER_TEMP/openhcs-published-gui-evidence" | \
            tee "$RUNNER_TEMP/openhcs-published-gui-evidence/smoke.json"

      - name: Upload published GUI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-gui-${{ matrix.os }}
          path: ${{ runner.temp }}/openhcs-published-gui-evidence
          if-no-files-found: warn
          retention-days: 14

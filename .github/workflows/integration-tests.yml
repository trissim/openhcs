# OpenHCS Integration Tests
#
# CI Strategy: Optimized boundary testing (31 checks total)
#
# Group 1: Python boundary tests (6 jobs)
#   - Python 3.11 (oldest) and 3.13 (newest well-supported) on Linux + Windows + macOS
#   - 2 Python versions × 3 OSes = 6 jobs
#   - Python 3.14 excluded: no pre-built NumPy/zeroc-ice wheels yet
#
# Group 2: Backend/microscope coverage (12 jobs)
#   - Python 3.12 on Linux + Windows + macOS
#   - All backends: disk, zarr
#   - All microscopes: ImageXpress, OperaPhenix
#   - 3 OSes × 2 backends × 2 microscopes = 12 jobs
#
# Group 3: OMERO tests (2 jobs)
#   - Python 3.11 and 3.12 on Linux only
#   - Uses pre-built zeroc-ice wheels (no Python 3.13+ support yet)
#
# Group 4: PyPI installation tests (6 jobs)
#   - Python 3.11 and 3.12 on Linux + Windows + macOS
#   - Validates PyPI-style installation across all platforms
#   - 2 Python versions × 3 OSes = 6 jobs
#
# Group 5: Native desktop installer tests (2 jobs)
#   - Real isolated Windows install plus shortcut/entry-point verification
#   - Real isolated macOS install plus app/desktop-launcher verification
#
# Group 6: Wheel integration test (1 job)
#   - Python 3.12 on Linux
#   - Full integration test suite against wheel installation
#
# Group 7: Official30 headless parity (1 job)
#   - Python 3.12 on Linux
#   - Acquires the manifest-pinned inputs and compares all 30 cases against the
#     committed native CellProfiler references over the real ZMQ execution path
#
# Total: 30 test jobs covering all Python versions (3.11-3.13), all 3 OSes,
# all backends, all microscope formats, both native desktop installers, and one
# serialized real Official30 parity corpus, plus the code-quality check.

name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        required: true
        default: 'cpu-only'
        type: choice
        options:
        - cpu-only
        - full-coverage
      dependency_source:
        description: 'Dependency source for external modules'
        required: true
        default: 'submodules'
        type: choice
        options:
        - submodules
        - pypi

env:
  OPENHCS_CI_DEP_SOURCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dependency_source || 'submodules' }}

jobs:
  # Group 1: Python version boundary testing (6 jobs)
  # Test oldest (3.11) and newest (3.13) Python on all 3 OSes
  # Python 3.14 excluded: no pre-built NumPy wheels yet (builds from source stall on Windows)
  python-boundary-tests:
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Boundary testing: oldest and newest well-supported versions
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ env.OPENHCS_CI_DEP_SOURCE == 'submodules' && 'recursive' || 'false' }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ubuntu-latest (23.10+) no longer provides libgl1-mesa-glx; use libgl1.
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Install local external modules (submodule mode)
        if: env.OPENHCS_CI_DEP_SOURCE == 'submodules'
        run: |
          python -m pip install --upgrade pip
          python -c "import subprocess,sys;mods=['external/ObjectState','external/python-introspect','external/metaclass-registry','external/arraybridge','external/pycodify','external/PolyStore','external/pyqt-reactive','external/zmqruntime'];[subprocess.check_call([sys.executable,'-m','pip','install','-e',m]) for m in mods]"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cellprofiler-compat]" pytest-split==0.11.0

      - name: Run generated CellProfiler ZMQ corpus in six fresh processes
        env:
          OPENHCS_CPU_ONLY: true
          NUMBA_DISABLE_INTEL_SVML: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 1 --cov=openhcs --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 2 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 3 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 4 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 5 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 6 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short

      - name: Run boundary version tests
        env:
          OPENHCS_CPU_ONLY: true
          NUMBA_DISABLE_INTEL_SVML: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: python -m pytest tests/integration/ --ignore=tests/integration/test_cellprofiler_generated_pipeline.py --cov=openhcs --cov-append --cov-report=term --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}-${{ matrix.os }}
          path: .coverage
          include-hidden-files: true
          retention-days: 1

      - name: Show ZMQ logs on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          candidates = []
          home = Path.home()
          candidates.append(home / ".local" / "share" / "openhcs" / "logs")
          candidates.append(home / ".local" / "state" / "openhcs" / "logs")
          xdg_state = os.environ.get("XDG_STATE_HOME")
          if xdg_state:
            candidates.append(Path(xdg_state) / "openhcs" / "logs")

          patterns = [
            "openhcs_zmq_server_*.log",
            "zmq_worker_exec_*.log",
            "openhcs_unified_*.log",
            "openhcs_subprocess_*.log",
          ]

          seen = set()
          for log_dir in candidates:
            if log_dir in seen:
              continue
            seen.add(log_dir)
            if not log_dir.is_dir():
              continue
            print(f"=== OpenHCS Logs: {log_dir} ===")
            for pattern in patterns:
              for log in sorted(log_dir.glob(pattern)):
                if log.is_file():
                  print(f"--- {log} ---")
                  try:
                    print(log.read_text())
                  except Exception as exc:
                    print(f"[WARN] Failed to read {log}: {exc}")
            print("")

          if not any(p.is_dir() for p in candidates):
            print("No OpenHCS log directories found.")
          PY

      - name: Upload ZMQ logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zmq-logs-python-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            ~/.local/share/openhcs/logs
            ~/.local/state/openhcs/logs

  # Group 2: Backend and microscope coverage (12 jobs)
  # Test all backend/microscope combinations on all 3 OSes with Python 3.12
  backend-microscope-tests:
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend: [disk, zarr]
        microscope: [ImageXpress, OperaPhenix]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ env.OPENHCS_CI_DEP_SOURCE == 'submodules' && 'recursive' || 'false' }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ubuntu-latest (23.10+) no longer provides libgl1-mesa-glx; use libgl1.
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Install local external modules (submodule mode)
        if: env.OPENHCS_CI_DEP_SOURCE == 'submodules'
        run: |
          python -m pip install --upgrade pip
          python -c "import subprocess,sys;mods=['external/ObjectState','external/python-introspect','external/metaclass-registry','external/arraybridge','external/pycodify','external/PolyStore','external/pyqt-reactive','external/zmqruntime'];[subprocess.check_call([sys.executable,'-m','pip','install','-e',m]) for m in mods]"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cellprofiler-compat]"

      - name: Run backend/microscope combination tests
        env:
          OPENHCS_CPU_ONLY: true
          NUMBA_DISABLE_INTEL_SVML: ${{ runner.os == 'macOS' && '1' || '0' }}
        # The generated CellProfiler corpus is independent of backend and
        # microscope fixtures and runs in the Python/OS boundary jobs above.
        run: python -m pytest tests/integration/ --ignore=tests/integration/test_cellprofiler_generated_pipeline.py --cov=openhcs --cov-report=term --it-backends ${{ matrix.backend }} --it-microscopes ${{ matrix.microscope }} --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.microscope }}
          path: .coverage
          include-hidden-files: true
          retention-days: 1

      - name: Show ZMQ logs on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          candidates = []
          home = Path.home()
          candidates.append(home / ".local" / "share" / "openhcs" / "logs")
          candidates.append(home / ".local" / "state" / "openhcs" / "logs")
          xdg_state = os.environ.get("XDG_STATE_HOME")
          if xdg_state:
            candidates.append(Path(xdg_state) / "openhcs" / "logs")

          patterns = [
            "openhcs_zmq_server_*.log",
            "zmq_worker_exec_*.log",
            "openhcs_unified_*.log",
            "openhcs_subprocess_*.log",
          ]

          seen = set()
          for log_dir in candidates:
            if log_dir in seen:
              continue
            seen.add(log_dir)
            if not log_dir.is_dir():
              continue
            print(f"=== OpenHCS Logs: {log_dir} ===")
            for pattern in patterns:
              for log in sorted(log_dir.glob(pattern)):
                if log.is_file():
                  print(f"--- {log} ---")
                  try:
                    print(log.read_text())
                  except Exception as exc:
                    print(f"[WARN] Failed to read {log}: {exc}")
            print("")

          if not any(p.is_dir() for p in candidates):
            print("No OpenHCS log directories found.")
          PY

      - name: Upload ZMQ logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zmq-logs-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.microscope }}
          path: |
            ~/.local/share/openhcs/logs
            ~/.local/state/openhcs/logs

  # Group 3: OMERO testing on Linux (2 jobs)
  # Test OMERO on Linux with Python 3.11 and 3.12
  # Python 3.13+ not supported yet - zeroc-ice pre-built wheels only available up to Python 3.12
  # See: https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/tag/20240202
  omero-tests-linux:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        include:
          - python-version: "3.11"
            ice-wheel: "https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20240202/zeroc_ice-3.6.5-cp311-cp311-manylinux_2_28_x86_64.whl"
          - python-version: "3.12"
            ice-wheel: "https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20240202/zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ env.OPENHCS_CI_DEP_SOURCE == 'submodules' && 'recursive' || 'false' }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          # ubuntu-latest (23.10+) no longer provides libgl1-mesa-glx; use libgl1.
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Install local external modules (submodule mode)
        if: env.OPENHCS_CI_DEP_SOURCE == 'submodules'
        run: |
          python -m pip install --upgrade pip
          python -c "import subprocess,sys;mods=['external/ObjectState','external/python-introspect','external/metaclass-registry','external/arraybridge','external/pycodify','external/PolyStore','external/pyqt-reactive','external/zmqruntime'];[subprocess.check_call([sys.executable,'-m','pip','install','-e',m]) for m in mods]"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install pre-built zeroc-ice wheel from Glencoe Software (OMERO maintainers)
          # Building from source fails on Python 3.11+ due to setuptools compatibility issues
          pip install ${{ matrix.ice-wheel }}
          pip install -e ".[dev,omero,cellprofiler-compat]"

      - name: Run OMERO integration tests (auto-starts Docker + OMERO)
        env:
          OPENHCS_CPU_ONLY: true
        # The generated CellProfiler corpus has no OMERO fixture dependency and
        # runs in the Python/OS boundary jobs rather than after the Docker suite.
        run: python -m pytest tests/integration/ --ignore=tests/integration/test_cellprofiler_generated_pipeline.py --cov=openhcs --cov-report=term --it-backends disk --it-microscopes OMERO --it-dims 3d --it-exec-mode multiprocessing --it-visualizers none -v --tb=short -s --log-cli-level=INFO
        # A cold runner may spend nearly 15 minutes pulling the 1.5 GB OMERO
        # image before the integration suite starts.
        timeout-minutes: 30

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-omero-python-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
          retention-days: 1

      - name: Show OMERO logs on failure
        if: failure()
        run: |
          echo "=== OMERO Server Logs ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml logs omeroserver || true
          echo "=== OMERO Web Logs ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml logs omeroweb || true
          echo "=== Database Logs ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml logs database || true

      - name: Cleanup OMERO containers
        if: always()
        run: |
          cd openhcs/omero
          sudo docker compose down -v || true

  # Code quality checks (linting, formatting, type checking)
  code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ env.OPENHCS_CI_DEP_SOURCE == 'submodules' && 'recursive' || 'false' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy packaging

      - name: Validate local dependency release floors
        if: env.OPENHCS_CI_DEP_SOURCE == 'submodules'
        run: python scripts/validate_local_release_floors.py

      - name: Run ruff (linting)
        continue-on-error: true  # Don't fail CI on linting errors initially
        run: |
          ruff check openhcs/ --output-format=github

      - name: Run black (formatting check)
        continue-on-error: true  # Don't fail CI on formatting errors initially
        run: |
          black --check openhcs/

      - name: Run mypy (type checking)
        continue-on-error: true  # Don't fail CI on type errors initially
        run: |
          mypy openhcs/ --ignore-missing-imports --no-strict-optional

  # Execute native bootstrap installers before tag-only release packaging.
  desktop-installer-source-test:
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Windows installer compiler
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Windows software OpenGL
        if: matrix.platform == 'windows'
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - name: Validate shared installer contract
        run: |
          python -m pip install build packaging pytest
          python -m pytest -q -c tests/installer/pytest.ini tests/installer

      - name: Parse Windows PowerShell installer sources
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          foreach ($sourcePath in @(
            "packaging/installers/windows/Install-OpenHCS.ps1",
            "packaging/installers/windows/Sign-Installer.ps1"
          )) {
            $source = Get-Content -LiteralPath $sourcePath -Raw
            [void][scriptblock]::Create($source)
          }

      - name: Execute and verify Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        timeout-minutes: 20
        run: |
          python -m build --wheel
          $releaseVersion = python -c "from pathlib import Path; from packaging.utils import parse_wheel_filename; print(parse_wheel_filename(next(Path('dist').glob('*.whl')).name)[1])"
          $releaseVersion = $releaseVersion.Trim()
          $stage = Join-Path $env:RUNNER_TEMP "OpenHCS-Windows-Smoke"
          $installRoot = Join-Path $env:RUNNER_TEMP "OpenHCS Installed"
          $contractPath = Join-Path $env:RUNNER_TEMP "installer_contract.json"
          New-Item -ItemType Directory -Path $stage | Out-Null
          python scripts/render_installer_contract.py `
            --version $releaseVersion `
            --output $contractPath
          & packaging/installers/windows/Build-InstallerLauncher.ps1 `
            -OutputDirectory $stage `
            -ContractPath $contractPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows GUI installer launcher build failed."
          }

          $launcher = Join-Path $stage "OpenHCS-Windows-Installer.exe"
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "Single-file Windows GUI installer was not staged."
          }
          $subsystem = python -c "import struct,sys; from pathlib import Path; data=Path(sys.argv[1]).read_bytes(); pe=struct.unpack_from('<I',data,0x3c)[0]; assert data[pe:pe+4]==b'PE\0\0'; print(struct.unpack_from('<H',data,pe+24+68)[0])" $launcher
          if ($subsystem.Trim() -ne "2") {
            throw "Windows installer launcher is not a GUI-subsystem executable."
          }
          if ((Get-Item -LiteralPath $launcher).Length -gt 2MB) {
            throw "Windows installer launcher unexpectedly embeds a large runtime."
          }

          $env:UV_FIND_LINKS = (Resolve-Path "dist").Path
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-home"
          $powerShellExecutable = (Get-Command powershell.exe -CommandType Application).Source
          $cancellationPath = Join-Path `
            ([IO.Path]::GetTempPath()) `
            ("openhcs-installer-cancel-{0}.marker" -f [Guid]::NewGuid().ToString("N"))
          $installerStartInfo = [Diagnostics.ProcessStartInfo]::new()
          $installerStartInfo.FileName = $launcher
          $installerStartInfo.UseShellExecute = $false
          foreach ($argument in @(
            "-Worker",
            "-RegisterMcpClients",
            "-InstallRoot", $installRoot,
            "-CancellationPath", $cancellationPath
          )) {
            [void]$installerStartInfo.ArgumentList.Add([string]$argument)
          }
          $installerProcess = [Diagnostics.Process]::Start($installerStartInfo)
          try {
            $installerProcess.WaitForExit()
            $installerExitCode = $installerProcess.ExitCode
          }
          finally {
            $installerProcess.Dispose()
          }
          if ($installerExitCode -ne 0) {
            throw "Windows installer failed with exit code $installerExitCode."
          }

          $desktopRoot = [Environment]::GetFolderPath("DesktopDirectory")
          $summaryJson = python -m scripts.smoke_installed_desktop `
            --platform windows `
            --contract $contractPath `
            --install-root $installRoot `
            --desktop-root $desktopRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Windows desktop smoke failed."
          }
          $summary = $summaryJson | ConvertFrom-Json

          $codexConfig = Join-Path $env:CODEX_HOME "config.toml"
          python -c "import sys,tomllib; p=tomllib.load(open(sys.argv[1],'rb'))['mcp_servers']['openhcs']; assert p['command']==sys.argv[2]; assert p['args']==['-NoProfile','-ExecutionPolicy','Bypass','-File',sys.argv[3],'mcp']" `
            $codexConfig `
            $powerShellExecutable `
            $summary.launcher_path
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer did not register the stable OpenHCS MCP launcher."
          }

          $shell = New-Object -ComObject WScript.Shell
          try {
            $shortcut = $shell.CreateShortcut($summary.shortcut_path)
            try {
              $expectedArguments = (
                '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{0}"' -f
                $summary.launcher_path
              )
              if ($shortcut.TargetPath -ne $powerShellExecutable) {
                throw "Desktop shortcut targets '$($shortcut.TargetPath)'."
              }
              if ($shortcut.Arguments -ne $expectedArguments) {
                throw "Desktop shortcut arguments do not target the launch adapter."
              }
              if ($shortcut.WorkingDirectory -ne $installRoot) {
                throw "Desktop shortcut working directory is not the install root."
              }
            }
            finally {
              [Runtime.InteropServices.Marshal]::FinalReleaseComObject($shortcut) |
                Out-Null
            }
          }
          finally {
            [Runtime.InteropServices.Marshal]::FinalReleaseComObject($shell) |
              Out-Null
          }
          Write-Host $summaryJson

      - name: Show Windows installer log on failure
        if: failure() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installerLog = Join-Path $env:RUNNER_TEMP "OpenHCS Installed\installer.log"
          if (Test-Path -LiteralPath $installerLog -PathType Leaf) {
            Write-Host "=== Windows installer log ==="
            Get-Content -LiteralPath $installerLog
          }
          else {
            Write-Host "Windows installer log was not created at '$installerLog'."
          }

          $viewerLogRoot = Join-Path $HOME ".local\share\openhcs\logs"
          if (Test-Path -LiteralPath $viewerLogRoot -PathType Container) {
            Get-ChildItem -LiteralPath $viewerLogRoot -Filter "*_detached_port_*.log" |
              Sort-Object FullName |
              ForEach-Object {
                Write-Host "=== Detached viewer log: $($_.FullName) ==="
                Get-Content -LiteralPath $_.FullName
              }
          }
          else {
            Write-Host "Detached viewer log directory was not created at '$viewerLogRoot'."
          }

      - name: Validate macOS installer sources
        if: matrix.platform == 'macos'
        run: |
          bash -n packaging/installers/macos/install-openhcs.sh
          bash -n packaging/installers/macos/build-installer.sh
          bash -n packaging/installers/macos/Sign-Installer.sh

      - name: Execute and verify macOS installer
        if: matrix.platform == 'macos'
        run: |
          python -m build --wheel
          release_version=$(python -c "from pathlib import Path; from packaging.utils import parse_wheel_filename; print(parse_wheel_filename(next(Path('dist').glob('*.whl')).name)[1])")
          staged_contract="$RUNNER_TEMP/installer_contract.json"
          installer_app="$RUNNER_TEMP/OpenHCS Release Installer.app"
          smoke_home="$RUNNER_TEMP/openhcs-installer-home"
          python scripts/render_installer_contract.py \
            --version "$release_version" \
            --output "$staged_contract"
          packaging/installers/macos/build-installer.sh \
            "$staged_contract" \
            "$installer_app"

          dmg_source="$RUNNER_TEMP/OpenHCS Installer DMG"
          installer_dmg="$RUNNER_TEMP/OpenHCS-macOS-Installer.dmg"
          mount_point="$RUNNER_TEMP/OpenHCS Installer Mount"
          mkdir -p "$dmg_source" "$mount_point"
          ditto "$installer_app" "$dmg_source/OpenHCS Installer.app"
          hdiutil create \
            -volname "OpenHCS Installer" \
            -srcfolder "$dmg_source" \
            -format UDZO \
            "$installer_dmg"
          hdiutil verify "$installer_dmg"
          hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_point" \
            "$installer_dmg"
          mounted_dmg=true
          cleanup_dmg_mount() {
            if [[ "$mounted_dmg" == true ]]; then
              hdiutil detach "$mount_point" || true
            fi
          }
          trap cleanup_dmg_mount EXIT
          test -d "$mount_point/OpenHCS Installer.app"
          hdiutil detach "$mount_point"
          mounted_dmg=false
          trap - EXIT

          mkdir -p "$smoke_home"
          export HOME="$smoke_home"
          export UV_FIND_LINKS="$GITHUB_WORKSPACE/dist"
          "$installer_app/Contents/Resources/install-openhcs.sh" \
            "$installer_app/Contents/Resources/installer_contract.json"

          product_name=$(/usr/bin/plutil -extract product_name raw -o - \
            "$staged_contract")
          codex_config="$HOME/.codex/config.toml"
          stable_launcher="$HOME/Library/Application Support/$product_name/current/launch-openhcs.sh"
          python -c "import sys,tomllib; p=tomllib.load(open(sys.argv[1],'rb'))['mcp_servers']['openhcs']; assert p['command']==sys.argv[2]; assert p['args']==['mcp']" \
            "$codex_config" \
            "$stable_launcher"
          python -m scripts.smoke_installed_desktop \
            --platform macos \
            --contract "$staged_contract" \
            --install-root "$HOME/Library/Application Support/$product_name" \
            --home-root "$HOME"

      - name: Show macOS installer log on failure
        if: failure() && matrix.platform == 'macos'
        run: |
          installer_log="$RUNNER_TEMP/openhcs-installer-home/Library/Logs/OpenHCS/installer.log"
          if [[ -f "$installer_log" ]]; then
            printf '%s\n' '=== macOS installer log ==='
            /bin/cat "$installer_log"
          else
            printf 'macOS installer log was not created at %s.\n' "$installer_log"
          fi

  # Test PyPI-style installation across Python versions and OSes (6 jobs)
  pypi-installation-test:
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ env.OPENHCS_CI_DEP_SOURCE == 'submodules' && 'recursive' || 'false' }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyQt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/sync_mcp_release_metadata.py --check
          python -m build

      - name: Test headless installation (base - no extras)
        shell: bash
        run: |
          python -m venv test_headless
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_headless/Scripts/activate
            WHEEL=$(ls dist/*.whl)
          else
            source test_headless/bin/activate
            WHEEL=$(ls dist/*.whl)
          fi
          pip install "$WHEEL"
          # Verify core OpenHCS works without GUI
          python - <<'PY'
          import openhcs
          from openhcs.core.config import PipelineConfig
          from openhcs.core.pipeline_document import PipelineDocumentAuthority
          from openhcs.core.steps.function_step import FunctionStep

          pipeline_document = PipelineDocumentAuthority.from_values(
              pipeline_config=PipelineConfig(),
              pipeline_steps=[FunctionStep()],
          )
          assert isinstance(pipeline_document.pipeline_config, PipelineConfig)
          assert len(pipeline_document.pipeline_steps) == 1
          assert isinstance(pipeline_document.pipeline_steps[0], FunctionStep)
          print(
              f'[OK] OpenHCS {openhcs.__version__} headless installation OK'
          )
          PY

      - name: Test GUI dependencies installation
        shell: bash
        run: |
          python -m venv test_gui
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_gui/Scripts/activate
            WHEEL=$(ls dist/*.whl)
          else
            source test_gui/bin/activate
            WHEEL=$(ls dist/*.whl)
          fi
          pip install "${WHEEL}[gui]"
          # Verify the GUI dependency set before the combined entrypoint smoke below.
          python -c "import openhcs; import psutil; import GPUtil; print(f'[OK] OpenHCS {openhcs.__version__} GUI dependencies installed')"

      - name: Test dev dependencies installation
        shell: bash
        run: |
          python -m venv test_dev
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_dev/Scripts/activate
            WHEEL=$(ls dist/*.whl)
          else
            source test_dev/bin/activate
            WHEEL=$(ls dist/*.whl)
          fi
          pip install "${WHEEL}[dev]"
          python -c "import pytest; import openhcs; print('[OK] Dev dependencies OK')"

      - name: Test declared desktop MCP installation outside checkout
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          XDG_CACHE_HOME: ${{ runner.temp }}/openhcs-mcp-cache
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_gui/Scripts/activate
          else
            source test_gui/bin/activate
          fi
          WHEEL=$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")
          DESKTOP_EXTRAS=$(python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --print-desktop-extras)
          pip install "${WHEEL}[${DESKTOP_EXTRAS}]"
          python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --check --capability-requirements
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_mcp.py" --forbid-import-root "$GITHUB_WORKSPACE"

  # Run the real 30-case headless comparator once. The cross-OS/Python matrix
  # above owns generated public-boundary coverage; this lane owns semantic
  # parity against committed native CellProfiler outputs.
  official30-headless-parity:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    env:
      OPENHCS_CP_NATIVE_REFERENCE_ROOT: ${{ github.workspace }}/benchmark/native_refs/official30_scoped_rows
      OPENHCS_CPU_ONLY: true
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install local external modules
        run: |
          python -m pip install --upgrade pip
          python -c "import subprocess,sys;mods=['external/ObjectState','external/python-introspect','external/metaclass-registry','external/arraybridge','external/pycodify','external/PolyStore','external/pyqt-reactive','external/zmqruntime'];[subprocess.check_call([sys.executable,'-m','pip','install','-e',m]) for m in mods]"

      - name: Install OpenHCS parity dependencies
        run: pip install -e ".[dev,cellprofiler-compat]"

      - name: Configure deterministic NumPy dispatch
        run: |
          python - <<'PY'
          import os

          from benchmark.adapters.cellprofiler import (
              DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES,
              NUMPY_DISABLED_CPU_FEATURES_ENV,
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"{NUMPY_DISABLED_CPU_FEATURES_ENV}="
                  f"{DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES}\n"
              )
          PY

      - name: Materialize manifest-pinned Official30 inputs
        env:
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30/datasets
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          from benchmark.cellprofiler_comparison import load_comparison_cases

          manifest_path = Path(
              "benchmark/manifests/official30_portable_axis1.json"
          )
          cases = load_comparison_cases(manifest_path)
          if len(cases) != 30:
              raise RuntimeError(
                  f"Official30 manifest resolved {len(cases)} cases, expected 30."
              )
          missing = tuple(
              (case.name, path)
              for case in cases
              for path in (case.dataset_path, case.cppipe_path)
              if not path.exists()
          )
          if missing:
              raise FileNotFoundError(
                  f"Official30 acquisition left missing inputs: {missing!r}"
              )
          print("Materialized 30 manifest-owned Official30 cases.")
          PY

      - name: Run all 30 headless parity cases over ZMQ
        env:
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30/datasets
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "0"
        run: |
          python -m pytest \
            tests/integration/test_cellprofiler_official30_zmq.py::test_official30_compile_execute_and_match_native_references_over_zmq \
            --basetemp "$RUNNER_TEMP/openhcs-official30/pytest" \
            -v \
            --tb=short

      - name: Upload per-case Official30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official30-headless-parity
          path: |
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/observations.jsonl
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/observations.csv
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/phase_timing.csv
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/summary.csv
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/suite_metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ZMQ logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: official30-headless-zmq-logs
          path: |
            ~/.local/share/openhcs/logs
            ~/.local/state/openhcs/logs
          if-no-files-found: warn
          retention-days: 14

  # Run integration tests against wheel installation
  wheel-integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ env.OPENHCS_CI_DEP_SOURCE == 'submodules' && 'recursive' || 'false' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel and run integration tests
        env:
          OPENHCS_CPU_ONLY: true
        run: |
          python -m venv test_wheel
          source test_wheel/bin/activate
          WHEEL=$(ls dist/*.whl)
          pip install "${WHEEL}[dev,cellprofiler-compat]" pytest-split==0.11.0
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 1 --cov=openhcs --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 2 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 3 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 4 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 5 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/test_cellprofiler_generated_pipeline.py --splits 6 --group 6 --cov=openhcs --cov-append --cov-report= --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          python -m pytest tests/integration/ --ignore=tests/integration/test_cellprofiler_generated_pipeline.py --cov=openhcs --cov-append --cov-report=term --it-backends disk --it-microscopes ImageXpress --it-dims 3d --it-exec-mode multiprocessing --it-zmq-mode zmq --it-visualizers none -v --tb=short
          cp .coverage ../.coverage.wheel
          deactivate

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-wheel-integration
          path: .coverage.wheel
          include-hidden-files: true
          retention-days: 1

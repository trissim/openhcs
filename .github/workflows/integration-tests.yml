# OpenHCS Integration Tests
#
# CI Strategy: Optimized boundary testing
#
# Foundational source gates (2 jobs)
#   - Python 3.12 on Linux
#   - Runs unit and core tests serially with offscreen Qt
#   - Runs the maintained PyQt GUI suite against the recursively pinned
#     pyqt-reactive candidate
#
# Desktop candidate canary (3 jobs)
#   - Python 3.12 on Windows, Apple Silicon macOS, and Intel macOS
#   - Builds the recursively pinned first-party wheels before publication
#   - Operates the installed candidate GUI through its packaged MCP surface
#   - Complements the Linux wheel-integration canary without repeating it
#
# Group 1: Python boundary tests (6 jobs)
#   - Python 3.11 (oldest) and 3.13 (newest well-supported) on Linux + Windows + macOS
#   - 2 Python versions × 3 OSes = 6 jobs
#   - Python 3.14 excluded: no pre-built NumPy/zeroc-ice wheels yet
#
# Group 2: Backend/microscope coverage (12 jobs)
#   - Python 3.12 on Linux + Windows + macOS
#   - All backends: disk, zarr
#   - All microscopes: ImageXpress, OperaPhenix
#   - 3 OSes × 2 backends × 2 microscopes = 12 jobs
#
# Group 3: OMERO tests (2 jobs)
#   - Python 3.11 and 3.12 on Linux only
#   - Uses pre-built zeroc-ice wheels (no Python 3.13+ support yet)
#
# Group 4: PyPI installation tests (6 jobs)
#   - Python 3.11 and 3.12 on Linux + Windows + macOS
#   - One metadata-derived dependency-publication gate prevents registry races
#   - Validates PyPI-style installation across all platforms
#   - 2 Python versions × 3 OSes = 6 jobs
#
# Group 5: Native desktop installer tests
#   - Real isolated Windows install plus shortcut/entry-point verification
#   - Real isolated macOS installs on Intel and Apple Silicon plus
#     app/desktop-launcher verification
#
# Group 6: Wheel integration test (1 job)
#   - Python 3.12 on Linux
#   - Full integration test suite against wheel installation
#
# Group 7: Official30 headless parity (1 job)
#   - Python 3.12 on Linux
#   - Acquires the manifest-pinned inputs and compares all 30 cases against the
#     committed native CellProfiler references over the real ZMQ execution path
#
# Group 8: Official30 real-viewer smoke (1 job)
#   - Python 3.12 on Linux under Xvfb with an intentionally incompatible Java 26
#   - Runs one manifest-owned case through Fiji-only and Fiji+Napari using the
#     existing end-to-end viewer validation boundary
#
# Together these jobs cover all supported Python versions and operating systems,
# every declared backend/microscope combination, the pre-publication desktop
# candidate, native desktop installers, the serialized real Official30 parity
# corpus, and a real-viewer smoke.

name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        required: true
        default: 'cpu-only'
        type: choice
        options:
        - cpu-only
        - full-coverage

permissions:
  actions: read
  contents: read

jobs:
  # Foundational unit-test gate, including GUI-backed tests under tests/unit.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1

      - name: Seed ignored and stale nested package build output
        run: |
          mkdir -p openhcs/omero/plugin/build/lib/omero_openhcs
          mkdir -p openhcs/omero/plugin/omero_openhcs.egg-info
          mkdir -p build/lib/openhcs/omero/plugin/build/lib/omero_openhcs
          mkdir -p build/lib/openhcs/omero/plugin/omero_openhcs.egg-info
          printf '%s\n' \
            'raise RuntimeError("nested build output must not ship")' \
            > openhcs/omero/plugin/build/lib/omero_openhcs/contamination_sentinel.py
          printf '%s\n' 'Name: contamination-sentinel' \
            > openhcs/omero/plugin/omero_openhcs.egg-info/PKG-INFO
          printf '%s\n' \
            'raise RuntimeError("stale build output must not ship")' \
            > build/lib/openhcs/omero/plugin/build/lib/omero_openhcs/stale_sentinel.py
          printf '%s\n' 'Name: stale-sentinel' \
            > build/lib/openhcs/omero/plugin/omero_openhcs.egg-info/PKG-INFO

      - name: Build and install the unit-test candidate wheels
        run: |
          python -m pip install --upgrade pip build
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,dev-gui,gui,cellprofiler-compat,fiji,mcp-http,napari

      - name: Materialize tracked Official30 unit fixture
        run: |
          CELLPROFILER_EXAMPLES_ROOT="$RUNNER_TEMP/openhcs-unit/cellprofiler-examples"
          echo "CELLPROFILER_EXAMPLES_ROOT=$CELLPROFILER_EXAMPLES_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$CELLPROFILER_EXAMPLES_ROOT/ExampleHuman/images"
          cp \
            benchmark/native_refs/official30_scoped_rows/ExampleHuman_ExampleHuman_wells_include_first1/native_cellprofiler_headless/ExampleHuman.cppipe \
            "$CELLPROFILER_EXAMPLES_ROOT/ExampleHuman/ExampleHuman.cppipe"

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest tests/unit tests/core -p no:randomly -q
          --cov=openhcs --cov-report=

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The GUI source gate intentionally installs the exact pinned pyqt-reactive
  # candidate. PyPI-facing jobs continue to prove the published dependency
  # boundary independently.
  gui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1

      - name: Build and install the GUI-test candidate wheels
        run: |
          python -m pip install --upgrade pip build
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,dev-gui,gui

      - name: Run PyQt GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          OPENHCS_TEST_ACTION_DELAY: "0.35"
          OPENHCS_TEST_WINDOW_DELAY: "0.1"
          OPENHCS_TEST_SAVE_DELAY: "0.1"
        run: >-
          python -m pytest tests/pyqt_gui -p no:randomly -q --tb=short
          --cov=openhcs --cov-report=

      - name: Upload GUI coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-gui
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Complete the desktop candidate matrix outside the Linux wheel lane without
  # waiting for recorded first-party dependency versions to reach PyPI.
  desktop-candidate-canary:
    name: desktop-candidate-live-mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]

    steps:
      - name: Allow Git to checkout long Windows paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install the desktop candidate wheels
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          desktop_extras=$(python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --print-desktop-extras)
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-desktop-candidate-wheels" \
            --extras "$desktop_extras"
          python -m pip check

      - name: Operate the desktop candidate through packaged MCP
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          XDG_CACHE_HOME: ${{ runner.temp }}/openhcs-desktop-candidate-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/openhcs-desktop-candidate-config
          XDG_DATA_HOME: ${{ runner.temp }}/openhcs-desktop-candidate-data
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          python -I "$GITHUB_WORKSPACE/scripts/smoke_installed_gui.py" \
            --forbid-import-root "$GITHUB_WORKSPACE"

  # Group 1: Python version boundary testing (6 jobs)
  # Test oldest (3.11) and newest (3.13) Python on all 3 OSes
  # Python 3.14 excluded: no pre-built NumPy wheels yet (builds from source stall on Windows)
  python-boundary-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Boundary testing: oldest and newest well-supported versions
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Allow Git to checkout long Windows paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ubuntu-latest (23.10+) no longer provides libgl1-mesa-glx; use libgl1.
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Build and install the boundary-test candidate wheels
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,cellprofiler-compat \
            --requirement pytest-split==0.11.0

      - name: Run generated CellProfiler ZMQ corpus in six fresh processes
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          NUMBA_DISABLE_INTEL_SVML: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          for group in 1 2 3 4 5 6; do
            coverage_flag="--cov-report="
            if [ "$group" != "1" ]; then coverage_flag="--cov-append --cov-report="; fi
            python scripts/run_installed_tests.py --coverage --repo-root "$GITHUB_WORKSPACE" -- \
              tests/integration/test_cellprofiler_generated_pipeline.py \
              --splits 6 --group "$group" $coverage_flag \
              --it-backends disk --it-microscopes ImageXpress --it-dims 3d \
              --it-exec-mode multiprocessing --it-zmq-mode zmq \
              --it-visualizers none -v --tb=short
          done

      - name: Run boundary version tests
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          NUMBA_DISABLE_INTEL_SVML: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: >-
          python scripts/run_installed_tests.py --coverage --repo-root "$GITHUB_WORKSPACE" --
          tests/integration/
          --ignore=tests/integration/test_cellprofiler_generated_pipeline.py
          --cov-append --cov-report=term --it-backends disk
          --it-microscopes ImageXpress --it-dims 3d
          --it-exec-mode multiprocessing --it-zmq-mode zmq
          --it-visualizers none -v --tb=short

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}-${{ matrix.os }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Show ZMQ logs on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          candidates = []
          home = Path.home()
          candidates.append(home / ".local" / "share" / "openhcs" / "logs")
          candidates.append(home / ".local" / "state" / "openhcs" / "logs")
          xdg_state = os.environ.get("XDG_STATE_HOME")
          if xdg_state:
            candidates.append(Path(xdg_state) / "openhcs" / "logs")

          patterns = [
            "openhcs_zmq_server_*.log",
            "zmq_worker_exec_*.log",
            "openhcs_unified_*.log",
            "openhcs_subprocess_*.log",
          ]

          seen = set()
          for log_dir in candidates:
            if log_dir in seen:
              continue
            seen.add(log_dir)
            if not log_dir.is_dir():
              continue
            print(f"=== OpenHCS Logs: {log_dir} ===")
            for pattern in patterns:
              for log in sorted(log_dir.glob(pattern)):
                if log.is_file():
                  print(f"--- {log} ---")
                  try:
                    print(log.read_text())
                  except Exception as exc:
                    print(f"[WARN] Failed to read {log}: {exc}")
            print("")

          if not any(p.is_dir() for p in candidates):
            print("No OpenHCS log directories found.")
          PY

      - name: Upload ZMQ logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmq-logs-python-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            ~/.local/share/openhcs/logs
            ~/.local/state/openhcs/logs

  # Group 2: Backend and microscope coverage (12 jobs)
  # Test all backend/microscope combinations on all 3 OSes with Python 3.12
  backend-microscope-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend: [disk, zarr]
        microscope: [ImageXpress, OperaPhenix]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # ubuntu-latest (23.10+) no longer provides libgl1-mesa-glx; use libgl1.
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Build and install the backend-test candidate wheels
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,cellprofiler-compat

      - name: Run backend/microscope combination tests
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          NUMBA_DISABLE_INTEL_SVML: ${{ runner.os == 'macOS' && '1' || '0' }}
        # The generated CellProfiler corpus is independent of backend and
        # microscope fixtures and runs in the Python/OS boundary jobs above.
        run: >-
          python scripts/run_installed_tests.py --coverage --repo-root "$GITHUB_WORKSPACE" --
          tests/integration/
          --ignore=tests/integration/test_cellprofiler_generated_pipeline.py
          --cov-report=term
          --it-backends ${{ matrix.backend }}
          --it-microscopes ${{ matrix.microscope }} --it-dims 3d
          --it-exec-mode multiprocessing --it-zmq-mode zmq
          --it-visualizers none -v --tb=short

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.microscope }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Show ZMQ logs on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          candidates = []
          home = Path.home()
          candidates.append(home / ".local" / "share" / "openhcs" / "logs")
          candidates.append(home / ".local" / "state" / "openhcs" / "logs")
          xdg_state = os.environ.get("XDG_STATE_HOME")
          if xdg_state:
            candidates.append(Path(xdg_state) / "openhcs" / "logs")

          patterns = [
            "openhcs_zmq_server_*.log",
            "zmq_worker_exec_*.log",
            "openhcs_unified_*.log",
            "openhcs_subprocess_*.log",
          ]

          seen = set()
          for log_dir in candidates:
            if log_dir in seen:
              continue
            seen.add(log_dir)
            if not log_dir.is_dir():
              continue
            print(f"=== OpenHCS Logs: {log_dir} ===")
            for pattern in patterns:
              for log in sorted(log_dir.glob(pattern)):
                if log.is_file():
                  print(f"--- {log} ---")
                  try:
                    print(log.read_text())
                  except Exception as exc:
                    print(f"[WARN] Failed to read {log}: {exc}")
            print("")

          if not any(p.is_dir() for p in candidates):
            print("No OpenHCS log directories found.")
          PY

      - name: Upload ZMQ logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zmq-logs-${{ matrix.os }}-${{ matrix.backend }}-${{ matrix.microscope }}
          path: |
            ~/.local/share/openhcs/logs
            ~/.local/state/openhcs/logs

  # Group 3: OMERO testing on Linux (2 jobs)
  # Test OMERO on Linux with Python 3.11 and 3.12
  # Python 3.13+ not supported yet - zeroc-ice pre-built wheels only available up to Python 3.12
  # See: https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/tag/20240202
  omero-tests-linux:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        include:
          - python-version: "3.11"
            ice-wheel: "https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20240202/zeroc_ice-3.6.5-cp311-cp311-manylinux_2_28_x86_64.whl"
          - python-version: "3.12"
            ice-wheel: "https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20240202/zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          # ubuntu-latest (23.10+) no longer provides libgl1-mesa-glx; use libgl1.
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Build and install the OMERO-test candidate wheels
        run: |
          python -m pip install --upgrade pip build
          # Install pre-built zeroc-ice wheel from Glencoe Software (OMERO maintainers)
          # Building from source fails on Python 3.11+ due to setuptools compatibility issues
          pip install ${{ matrix.ice-wheel }}
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,omero,cellprofiler-compat

      - name: Run OMERO integration tests (auto-starts Docker + OMERO)
        env:
          OPENHCS_CPU_ONLY: true
        # The generated CellProfiler corpus has no OMERO fixture dependency and
        # runs in the Python/OS boundary jobs rather than after the Docker suite.
        run: >-
          python scripts/run_installed_tests.py --coverage --repo-root "$GITHUB_WORKSPACE" --
          tests/integration/
          --ignore=tests/integration/test_cellprofiler_generated_pipeline.py
          --cov-report=term --it-backends disk
          --it-microscopes OMERO --it-dims 3d
          --it-exec-mode multiprocessing --it-visualizers none
          -v --tb=short -s --log-cli-level=INFO
        # A cold runner may spend nearly 15 minutes pulling the 1.5 GB OMERO
        # image before the integration suite starts.
        timeout-minutes: 30

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-omero-python-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Show OMERO logs on failure
        if: failure()
        run: |
          echo "=== OMERO Component Diagnostics ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml exec -T omeroserver \
            sh -lc 'cd /opt/omero/server/OMERO.server && bin/omero admin diagnostics' || true
          echo "=== OMERO Table Service Log ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml exec -T omeroserver \
            sh -lc 'cd /opt/omero/server/OMERO.server && cat var/log/Tables-0.log' || true
          echo "=== OMERO Grid Error Log ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml exec -T omeroserver \
            sh -lc 'cd /opt/omero/server/OMERO.server && cat var/log/master.err' || true
          echo "=== OMERO Server Logs ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml logs omeroserver || true
          echo "=== OMERO Web Logs ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml logs omeroweb || true
          echo "=== Database Logs ==="
          sudo docker compose -f openhcs/omero/docker-compose.yml logs database || true

      - name: Cleanup OMERO containers
        if: always()
        run: |
          cd openhcs/omero
          sudo docker compose down -v || true

  # Code quality checks (linting, formatting, type checking)
  code-quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-quality.txt

      - name: Run correctness-only Ruff gate
        run: |
          ruff check openhcs/ --select E9,F63,F7 --output-format=github

      - name: Enforce quality on changed Python files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            quality_base_sha="$PULL_REQUEST_BASE_SHA"
          else
            quality_base_sha=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/integration-tests.yml/runs" \
              -f branch="$GITHUB_REF_NAME" \
              -f status=success \
              -F per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty')
          fi
          if [[ -z "$quality_base_sha" ]] || \
              ! git cat-file -e "${quality_base_sha}^{commit}" 2>/dev/null || \
              ! git merge-base --is-ancestor "$quality_base_sha" "$GITHUB_SHA"; then
            printf 'No successful ancestor establishes the Python quality baseline.\n' >&2
            exit 1
          fi
          printf 'Validating Python changes since successful head %s.\n' \
            "$quality_base_sha"
          mapfile -d '' changed_python_files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$quality_base_sha" "$GITHUB_SHA" -- '*.py'
          )
          if [[ "${#changed_python_files[@]}" -eq 0 ]]; then
            printf 'No changed Python files to validate.\n'
            exit 0
          fi
          printf 'Validating %s changed Python files.\n' \
            "${#changed_python_files[@]}"
          ruff check --select E9,F63,F7 --output-format=github \
            "${changed_python_files[@]}"
          black --check "${changed_python_files[@]}"

      - name: Run ruff (broad linting diagnostics)
        continue-on-error: true  # Don't fail CI on linting errors initially
        run: |
          ruff check openhcs/ --output-format=github

      - name: Run black (formatting check)
        continue-on-error: true  # Don't fail CI on formatting errors initially
        run: |
          black --check openhcs/

      - name: Run mypy (type checking)
        continue-on-error: true  # Don't fail CI on type errors initially
        run: |
          mypy openhcs/ --ignore-missing-imports --no-strict-optional

  # Execute native bootstrap installers before tag-only release packaging.
  desktop-installer-source-test:
    needs: pypi-dependency-readiness
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x86_64
          - os: macos-latest
            platform: macos
            architecture: arm64
          - os: macos-15-intel
            platform: macos
            architecture: x86_64

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify macOS installer architecture
        if: matrix.platform == 'macos'
        run: |
          actual_architecture=$(uname -m)
          if [[ "$actual_architecture" != "${{ matrix.architecture }}" ]]; then
            printf 'Expected %s runner, got %s.\n' \
              '${{ matrix.architecture }}' "$actual_architecture" >&2
            exit 1
          fi

      - name: Disable Windows long paths for installer compatibility proof
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $filesystemPolicy = `
            "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem"
          Set-ItemProperty `
            -LiteralPath $filesystemPolicy `
            -Name LongPathsEnabled `
            -Value 0
          $longPathsEnabled = Get-ItemPropertyValue `
            -LiteralPath $filesystemPolicy `
            -Name LongPathsEnabled
          if ($longPathsEnabled -ne 0) {
            throw "Windows long-path support remains enabled."
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Windows installer compiler
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Set up Windows software OpenGL
        if: matrix.platform == 'windows'
        uses: pyvista/setup-headless-display-action@b0bf9f57d62d2b3fee9f1c0e0c7e390f05e97a4e # v5.0.0
        with:
          qt: true
          wm: herbstluftwm

      - name: Validate shared installer contract
        run: |
          python -m pip install build packaging pytest
          python -m pytest -q -c tests/installer/pytest.ini tests/installer

      - name: Parse Windows PowerShell installer sources
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          foreach ($sourcePath in @(
            "packaging/installers/windows/Install-OpenHCS.ps1",
            "packaging/installers/windows/Sign-Installer.ps1"
          )) {
            $source = Get-Content -LiteralPath $sourcePath -Raw
            [void][scriptblock]::Create($source)
          }

      - name: Execute and verify Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $releaseVersion = python scripts/stage_ci_candidate_version.py `
            --run-id $env:GITHUB_RUN_ID
          $releaseVersion = $releaseVersion.Trim()
          python -m build --wheel
          $stage = Join-Path $env:RUNNER_TEMP "OpenHCS-Windows-Smoke"
          $installRoot = Join-Path `
            ([Environment]::GetFolderPath("LocalApplicationData")) `
            "OpenHCS"
          $contractPath = Join-Path $env:RUNNER_TEMP "installer_contract.json"
          New-Item -ItemType Directory -Path $stage | Out-Null
          python -m scripts.render_installer_contract `
            --version $releaseVersion `
            --output $contractPath
          & packaging/installers/windows/Build-InstallerLauncher.ps1 `
            -OutputDirectory $stage `
            -ContractPath $contractPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows GUI installer launcher build failed."
          }

          $launcher = Join-Path $stage "OpenHCS-Windows-Installer.exe"
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "Single-file Windows GUI installer was not staged."
          }
          $subsystem = python -c "import struct,sys; from pathlib import Path; data=Path(sys.argv[1]).read_bytes(); pe=struct.unpack_from('<I',data,0x3c)[0]; assert data[pe:pe+4]==b'PE\0\0'; print(struct.unpack_from('<H',data,pe+24+68)[0])" $launcher
          if ($subsystem.Trim() -ne "2") {
            throw "Windows installer launcher is not a GUI-subsystem executable."
          }
          if ((Get-Item -LiteralPath $launcher).Length -gt 2MB) {
            throw "Windows installer launcher unexpectedly embeds a large runtime."
          }
          Add-Type -AssemblyName System.Drawing
          $actualInstallerIcon = [Drawing.Icon]::ExtractAssociatedIcon($launcher)
          if ($null -eq $actualInstallerIcon) {
            throw "Windows could not extract the installer executable icon."
          }
          $expectedInstallerIcon = [Drawing.Icon]::new(
            (Resolve-Path "openhcs/resources/assets/openhcs.ico").Path,
            $actualInstallerIcon.Size
          )
          $actualInstallerBitmap = $actualInstallerIcon.ToBitmap()
          $expectedInstallerBitmap = $expectedInstallerIcon.ToBitmap()
          try {
            if ($actualInstallerBitmap.Size -ne $expectedInstallerBitmap.Size) {
              throw "Windows installer icon dimensions do not match the brand asset."
            }
            for ($x = 0; $x -lt $actualInstallerBitmap.Width; $x++) {
              for ($y = 0; $y -lt $actualInstallerBitmap.Height; $y++) {
                if (
                  $actualInstallerBitmap.GetPixel($x, $y).ToArgb() -ne
                  $expectedInstallerBitmap.GetPixel($x, $y).ToArgb()
                ) {
                  throw "Windows installer executable icon differs from the brand asset."
                }
              }
            }
          }
          finally {
            $actualInstallerBitmap.Dispose()
            $expectedInstallerBitmap.Dispose()
            $actualInstallerIcon.Dispose()
            $expectedInstallerIcon.Dispose()
          }

          $env:UV_FIND_LINKS = (Resolve-Path "dist").Path
          $env:PIP_FIND_LINKS = $env:UV_FIND_LINKS
          $hostilePipIndex = "http://127.0.0.1:9/simple"
          $hostilePipConfig = Join-Path $env:RUNNER_TEMP "hostile-pip.ini"
          Set-Content -LiteralPath $hostilePipConfig -Encoding UTF8 -Value @(
            "[global]"
            "index-url = $hostilePipIndex"
            "extra-index-url = $hostilePipIndex"
          )
          $env:PIP_CONFIG_FILE = $hostilePipConfig
          $env:PIP_INDEX_URL = $hostilePipIndex
          $env:PIP_EXTRA_INDEX_URL = $hostilePipIndex
          $env:PIP_RETRIES = "0"
          $env:PIP_TIMEOUT = "1"
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-home"
          $powerShellExecutable = (Get-Command powershell.exe -CommandType Application).Source
          $cancellationPath = Join-Path `
            ([IO.Path]::GetTempPath()) `
            ("openhcs-installer-cancel-{0}.marker" -f [Guid]::NewGuid().ToString("N"))
          function Invoke-OpenHcsInstallerWorker {
            param([Parameter(Mandatory = $true)][string]$CancellationMarker)

            $installerStartInfo = [Diagnostics.ProcessStartInfo]::new()
            $installerStartInfo.FileName = $launcher
            $installerStartInfo.UseShellExecute = $false
            foreach ($argument in @(
              "-Worker",
              "-RegisterMcpClients",
              "-InstallRoot", $installRoot,
              "-CancellationPath", $CancellationMarker
            )) {
              [void]$installerStartInfo.ArgumentList.Add([string]$argument)
            }
            $installerProcess = [Diagnostics.Process]::Start($installerStartInfo)
            try {
              $installerProcess.WaitForExit()
              return $installerProcess.ExitCode
            }
            finally {
              $installerProcess.Dispose()
            }
          }
          $installerExitCode = Invoke-OpenHcsInstallerWorker $cancellationPath
          if ($installerExitCode -ne 0) {
            throw "Windows installer failed with exit code $installerExitCode."
          }
          $installerLog = Join-Path $installRoot "installer.log"
          if (
            (Get-Content -LiteralPath $installerLog -Raw).Contains($hostilePipIndex)
          ) {
            throw "Windows installer inherited a host package index."
          }

          $desktopRoot = [Environment]::GetFolderPath("DesktopDirectory")
          $contract = Get-Content -LiteralPath $contractPath -Raw |
            ConvertFrom-Json
          $shortcutPath = Join-Path `
            $desktopRoot `
            ("{0}.lnk" -f $contract.product_name)
          if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) {
            throw "Initial Windows install did not create '$shortcutPath'."
          }
          Remove-Item -LiteralPath $shortcutPath -Force
          if (Test-Path -LiteralPath $shortcutPath) {
            throw "Could not remove the shortcut repair fixture '$shortcutPath'."
          }

          # Reproduce the field failure: package-managed web assets can exceed
          # MAX_PATH even though uv and Python created them successfully.
          $environmentsRoot = Join-Path $installRoot "environments"
          $staleEnvironment = Join-Path `
            $environmentsRoot `
            "env-20000101T000000Z-00000000000000000000000000000000"
          $deepDirectory = Join-Path `
            $staleEnvironment `
            "Lib\site-packages\jupyterlab\static\build\share\jupyter\labextensions\@jupyter-widgets\jupyterlab-manager\static\packages\base\lib"
          $deepFile = Join-Path `
            $deepDirectory `
            "packages_base_lib_index_js-webpack_sharing_consume_default_jquery_jquery.5dd13f8e980fa3c50bfe.js"
          if ($deepFile.Length -le 260) {
            throw "The Windows update fixture does not cross the MAX_PATH boundary."
          }
          [IO.Directory]::CreateDirectory("\\?\$deepDirectory") | Out-Null
          [IO.File]::WriteAllText("\\?\$deepFile", "stale update fixture")

          $updateCancellationPath = Join-Path `
            ([IO.Path]::GetTempPath()) `
            ("openhcs-installer-cancel-{0}.marker" -f [Guid]::NewGuid().ToString("N"))
          $updateExitCode = Invoke-OpenHcsInstallerWorker $updateCancellationPath
          if ($updateExitCode -ne 0) {
            throw "Windows installer update failed with exit code $updateExitCode."
          }
          if (
            (Get-Content -LiteralPath $installerLog -Raw).Contains($hostilePipIndex)
          ) {
            throw "Windows installer update inherited a host package index."
          }
          if (Test-Path -LiteralPath $staleEnvironment) {
            throw "Windows installer update left the long-path stale environment behind."
          }
          $summaryJson = python -m scripts.smoke_installed_desktop `
            --platform windows `
            --contract $contractPath `
            --install-root $installRoot `
            --desktop-root $desktopRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Updated Windows desktop smoke failed."
          }
          $summary = $summaryJson | ConvertFrom-Json

          Set-Content `
            -LiteralPath $summary.launcher_path `
            -Encoding UTF8 `
            -Value "stale launcher fixture"
          Set-Content `
            -LiteralPath $summary.application_path `
            -Encoding ASCII `
            -Value "stale GUI launcher fixture"
          Remove-Item -LiteralPath $summary.shortcut_path -Force
          $env:OPENHCS_UV_EXECUTABLE = Join-Path `
            $installRoot `
            "bootstrap\uv\uv.exe"
          $environmentRoot = [IO.Path]::GetFullPath(
            [string]$summary.environment
          )
          $expectedEnvironmentParent = [IO.Path]::GetFullPath(
            $installRoot
          ).TrimEnd("\", "/")
          $actualEnvironmentParent = [IO.Path]::GetDirectoryName(
            $environmentRoot
          ).TrimEnd("\", "/")
          if (-not [string]::Equals(
              $actualEnvironmentParent,
              $expectedEnvironmentParent,
              [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Windows candidate environment is not directly under the install root."
          }
          $environmentPython = Join-Path `
            $environmentRoot `
            "Scripts\python.exe"
          $longestInstalledPath = Get-ChildItem `
            -LiteralPath $environmentRoot `
            -Recurse `
            -Force |
            Sort-Object { $_.FullName.Length } -Descending |
            Select-Object -First 1
          if ($longestInstalledPath.FullName.Length -ge 260) {
            throw (
              "Managed environment exceeds the default Windows path budget: " +
              "'$($longestInstalledPath.FullName)'."
            )
          }
          $installerUv = Join-Path $installRoot "bootstrap\uv\uv.exe"
          & $installerUv `
            --no-config pip install `
            --dry-run `
            --python $environmentPython `
            --upgrade "openhcs==$releaseVersion"
          if ($LASTEXITCODE -ne 0) {
            throw "Installer-owned uv could not resolve the stable OpenHCS update."
          }
          # Keep the published release as the installer acceptance input, then
          # replace only OpenHCS with the checked-out candidate so the launcher
          # and packaged asset paths are exercised from a production layout.
          & $installerUv `
            --no-config pip install `
            --python $environmentPython `
            --reinstall-package openhcs `
            $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install the OpenHCS candidate for launcher verification."
          }
          $deploymentJson = & $environmentPython `
            -I -m openhcs.desktop_deployment_cli `
            --installation-pointer=$($summary.launcher_path) `
            --json
          if ($LASTEXITCODE -ne 0) {
            throw "Windows in-app desktop deployment refresh failed."
          }
          $deploymentReport = $deploymentJson | ConvertFrom-Json
          if ($deploymentReport.restart_executable -ne $summary.application_path) {
            throw (
              "Windows desktop deployment restart target " +
              "'$($deploymentReport.restart_executable)' does not match " +
              "'$($summary.application_path)'."
            )
          }
          $summaryJson = python -m scripts.smoke_installed_desktop `
            --platform windows `
            --contract $contractPath `
            --install-root $installRoot `
            --desktop-root $desktopRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Refreshed Windows desktop smoke failed."
          }
          $summary = $summaryJson | ConvertFrom-Json

          $codexConfig = Join-Path $env:CODEX_HOME "config.toml"
          python -c "import sys,tomllib; p=tomllib.load(open(sys.argv[1],'rb'))['mcp_servers']['openhcs']; assert p['command']==sys.argv[2]; assert p['args']==['-NoProfile','-ExecutionPolicy','Bypass','-File',sys.argv[3],'mcp']" `
            $codexConfig `
            $powerShellExecutable `
            $summary.launcher_path
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer did not register the stable OpenHCS MCP launcher."
          }

          $shell = New-Object -ComObject WScript.Shell
          try {
            $shortcut = $shell.CreateShortcut($summary.shortcut_path)
            try {
              $expectedGuiExecutable = Join-Path $installRoot "OpenHCS.exe"
              if ($summary.application_path -ne $expectedGuiExecutable) {
                throw (
                  "Desktop deployment reported '$($summary.application_path)' " +
                  "instead of '$expectedGuiExecutable'."
                )
              }
              if ($shortcut.TargetPath -ne $summary.application_path) {
                throw "Desktop shortcut targets '$($shortcut.TargetPath)'."
              }
              if (-not [string]::IsNullOrEmpty($shortcut.Arguments)) {
                throw "Desktop shortcut unexpectedly supplies console arguments."
              }
              if ($shortcut.WorkingDirectory -ne $installRoot) {
                throw "Desktop shortcut working directory is not the install root."
              }
              $expectedIconPath = (
                & $environmentPython `
                  -I -m openhcs.resources.brand windows_icon
              ).Trim()
              if ($LASTEXITCODE -ne 0) {
                throw "Installed package could not resolve its Windows brand icon."
              }
              if (-not (Test-Path -LiteralPath $expectedIconPath -PathType Leaf)) {
                throw "Installed Windows brand icon is missing."
              }
              $expectedIconLocation = "$expectedIconPath,0"
              if ($shortcut.IconLocation -ne $expectedIconLocation) {
                throw (
                  "Desktop shortcut icon '$($shortcut.IconLocation)' does not " +
                  "match '$expectedIconLocation'."
                )
              }
              $guiSubsystem = python -c "import struct,sys; from pathlib import Path; data=Path(sys.argv[1]).read_bytes(); pe=struct.unpack_from('<I',data,0x3c)[0]; assert data[pe:pe+4]==b'PE\0\0'; print(struct.unpack_from('<H',data,pe+24+68)[0])" `
                $shortcut.TargetPath
              if ($guiSubsystem.Trim() -ne "2") {
                throw "Desktop shortcut target is not a GUI-subsystem executable."
              }
              $currentEnvironmentPointer = Join-Path `
                $installRoot `
                "current-environment"
              if (-not (Test-Path -LiteralPath $currentEnvironmentPointer -PathType Leaf)) {
                throw "Windows current-environment pointer is missing."
              }
              $currentEnvironmentName = (
                Get-Content -LiteralPath $currentEnvironmentPointer -Raw
              ).Trim()
              $expectedEnvironmentName = [IO.Path]::GetFileName($environmentRoot)
              if ($currentEnvironmentName -ne $expectedEnvironmentName) {
                throw (
                  "Windows current-environment pointer '$currentEnvironmentName' " +
                  "does not identify '$expectedEnvironmentName'."
                )
              }
            }
            finally {
              [Runtime.InteropServices.Marshal]::FinalReleaseComObject($shortcut) |
                Out-Null
            }
          }
          finally {
            [Runtime.InteropServices.Marshal]::FinalReleaseComObject($shell) |
              Out-Null
          }

          # Exercise the real stable WinExe without the disposable gui-script
          # shim. The probe module records the inherited launch contract and
          # signals the same startup handoff used by the Qt progress window.
          $currentEnvironmentPointer = Join-Path $installRoot "current-environment"
          $savedEnvironmentName = (
            Get-Content -LiteralPath $currentEnvironmentPointer -Raw
          ).Trim()
          $probeEnvironmentName = "env-launchprobe"
          $probeEnvironment = Join-Path $installRoot $probeEnvironmentName
          $probeMarker = Join-Path $env:RUNNER_TEMP "openhcs-launcher-probe.json"
          try {
            python -m venv $probeEnvironment
            $probePython = Join-Path $probeEnvironment "Scripts\python.exe"
            $probeSitePackages = (& $probePython -c "import site; print(site.getsitepackages()[0])").Trim()
            $probeModuleRoot = Join-Path $probeSitePackages "openhcs\pyqt_gui"
            New-Item -ItemType Directory -Path $probeModuleRoot -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $probeSitePackages "openhcs\__init__.py") `
              -Encoding ASCII -Value ""
            Set-Content -LiteralPath (Join-Path $probeModuleRoot "__init__.py") `
              -Encoding ASCII -Value ""
            $probeSource = @'
          import ctypes
          import json
          import os
          import sys
          from pathlib import Path

          event_name = os.environ["OPENHCS_STARTUP_HANDOFF_EVENT"]
          kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
          open_event = kernel32.OpenEventW
          open_event.argtypes = [ctypes.c_uint32, ctypes.c_int, ctypes.c_wchar_p]
          open_event.restype = ctypes.c_void_p
          set_event = kernel32.SetEvent
          set_event.argtypes = [ctypes.c_void_p]
          set_event.restype = ctypes.c_int
          close_handle = kernel32.CloseHandle
          close_handle.argtypes = [ctypes.c_void_p]
          close_handle.restype = ctypes.c_int
          handle = open_event(0x0002, False, event_name)
          if not handle:
              raise ctypes.WinError(ctypes.get_last_error())
          try:
              Path(os.environ["OPENHCS_LAUNCHER_PROBE_PATH"]).write_text(
                  json.dumps(
                      {
                          "argv": sys.argv[1:],
                          "restart_executable": os.environ[
                              "OPENHCS_DESKTOP_RESTART_EXECUTABLE"
                          ],
                          "installation_pointer": os.environ[
                              "OPENHCS_MCP_INSTALLATION_POINTER"
                          ],
                      }
                  ),
                  encoding="utf-8",
              )
              if not set_event(handle):
                  raise ctypes.WinError(ctypes.get_last_error())
          finally:
              close_handle(handle)
          '@
            Set-Content -LiteralPath (Join-Path $probeModuleRoot "__main__.py") `
              -Encoding UTF8 -Value $probeSource
            Set-Content -LiteralPath $currentEnvironmentPointer `
              -Encoding UTF8 -Value $probeEnvironmentName
            $env:OPENHCS_LAUNCHER_PROBE_PATH = $probeMarker
            $probeArguments = @(
              "--probe-value",
              "value with spaces",
              "trailing\"
            )
            $probeStartInfo = [Diagnostics.ProcessStartInfo]::new()
            $probeStartInfo.FileName = $summary.application_path
            $probeStartInfo.UseShellExecute = $false
            foreach ($probeArgument in $probeArguments) {
              [void]$probeStartInfo.ArgumentList.Add($probeArgument)
            }
            $probeProcess = [Diagnostics.Process]::Start($probeStartInfo)
            try {
              if (-not $probeProcess.WaitForExit(30000)) {
                $probeProcess.Kill($true)
                throw "Windows stable launcher probe timed out."
              }
              if ($probeProcess.ExitCode -ne 0) {
                throw (
                  "Windows stable launcher probe failed with exit code " +
                  "$($probeProcess.ExitCode)."
                )
              }
            }
            finally {
              $probeProcess.Dispose()
            }
            if (-not (Test-Path -LiteralPath $probeMarker -PathType Leaf)) {
              throw "Windows stable launcher did not execute the declared module."
            }
            $probe = Get-Content -LiteralPath $probeMarker -Raw | ConvertFrom-Json
            if ((Compare-Object @($probe.argv) $probeArguments).Count -ne 0) {
              throw "Windows stable launcher changed forwarded arguments."
            }
            if ($probe.restart_executable -ne $summary.application_path) {
              throw "Windows stable launcher did not publish its restart identity."
            }
            if ($probe.installation_pointer -ne $summary.launcher_path) {
              throw "Windows stable launcher did not publish its installation pointer."
            }
          }
          finally {
            Set-Content -LiteralPath $currentEnvironmentPointer `
              -Encoding UTF8 -Value $savedEnvironmentName
            Remove-Item Env:OPENHCS_LAUNCHER_PROBE_PATH -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $probeMarker -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $probeEnvironment -Recurse -Force `
              -ErrorAction SilentlyContinue
          }

          # Reproduce issue #103 with the exact Windows filesystem constraint:
          # the old console-script launcher is open without delete sharing while
          # the in-app updater stages, verifies, and publishes a sibling env.
          $lockedEnvironment = $environmentRoot
          $lockedEntryPoint = Join-Path `
            $lockedEnvironment `
            "Scripts\openhcs.exe"
          $stableApplicationLauncher = [string]$summary.application_path
          $launcherFingerprint = Join-Path `
            $installRoot `
            "OpenHCS-launcher-fingerprint.json"
          Set-Content -LiteralPath $launcherFingerprint `
            -Encoding UTF8 -Value '{"stale":true}'
          $stableLauncherHash = (
            Get-FileHash -LiteralPath $stableApplicationLauncher -Algorithm SHA256
          ).Hash
          $lockedEntryStream = [IO.FileStream]::new(
            $lockedEntryPoint,
            [IO.FileMode]::Open,
            [IO.FileAccess]::Read,
            [IO.FileShare]::Read
          )
          $lockedApplicationStream = [IO.FileStream]::new(
            $stableApplicationLauncher,
            [IO.FileMode]::Open,
            [IO.FileAccess]::Read,
            [IO.FileShare]::Read
          )
          try {
            $basePython = (& $environmentPython -c "import sys; print(sys._base_executable)").Trim()
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $basePython -PathType Leaf)) {
              throw "Installed OpenHCS did not identify its managed base Python."
            }
            & $basePython -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()"
            if ($LASTEXITCODE -ne 0) {
              throw "Managed base Python could not create the updater progress window."
            }
            $installedWorker = (& $environmentPython -c "from pathlib import Path; import openhcs.pyqt_gui.services.desktop_update_worker as worker; print(Path(worker.__file__).resolve())").Trim()
            & $basePython -I $installedWorker --help | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Managed base Python could not load the copied updater worker."
            }
            $env:OPENHCS_UV_EXECUTABLE = $installerUv
            $env:OPENHCS_MCP_INSTALLATION_POINTER = [string]$summary.launcher_path
            $env:OPENHCS_DESKTOP_RESTART_EXECUTABLE = [string]$summary.application_path
            $updateReportJson = & $environmentPython `
              scripts/smoke_staged_desktop_update.py `
              --latest-version $releaseVersion
            if ($LASTEXITCODE -ne 0) {
              throw "Locked-launcher staged update failed: $updateReportJson"
            }
            $updateReport = $updateReportJson | ConvertFrom-Json
            if ($null -ne $updateReport.error_message) {
              throw "Locked-launcher staged update reported: $($updateReport.error_message)"
            }
            $publishedLauncherHash = (
              Get-FileHash -LiteralPath $stableApplicationLauncher -Algorithm SHA256
            ).Hash
            if ($publishedLauncherHash -ne $stableLauncherHash) {
              throw "Staged update replaced the concurrently running stable launcher."
            }
          }
          finally {
            $lockedApplicationStream.Dispose()
            $lockedEntryStream.Dispose()
            Remove-Item Env:OPENHCS_UV_EXECUTABLE -ErrorAction SilentlyContinue
            Remove-Item Env:OPENHCS_MCP_INSTALLATION_POINTER `
              -ErrorAction SilentlyContinue
            Remove-Item Env:OPENHCS_DESKTOP_RESTART_EXECUTABLE `
              -ErrorAction SilentlyContinue
          }
          $publishedEnvironmentName = (
            Get-Content -LiteralPath $currentEnvironmentPointer -Raw
          ).Trim()
          $candidateEnvironment = Join-Path `
            ([IO.Path]::GetDirectoryName($lockedEnvironment)) `
            $publishedEnvironmentName
          if (-not (Test-Path -LiteralPath $candidateEnvironment -PathType Container)) {
            throw "Staged updater did not publish the verified candidate environment."
          }
          if (-not (Test-Path -LiteralPath $lockedEnvironment -PathType Container)) {
            throw "Staged updater mutated or removed the locked previous environment."
          }
          $candidatePython = Join-Path $candidateEnvironment "Scripts\python.exe"
          $env:OPENHCS_UV_EXECUTABLE = $installerUv
          try {
            $repairReportJson = & $candidatePython -I `
              -m openhcs.desktop_deployment_cli `
              "--installation-pointer=$($summary.launcher_path)" `
              --json
            if ($LASTEXITCODE -ne 0) {
              throw "Deferred stable-launcher refresh failed: $repairReportJson"
            }
            $repairReport = $repairReportJson | ConvertFrom-Json
            if (@($repairReport.deferred_paths).Count -ne 0) {
              throw "Stable-launcher refresh remained deferred after releasing the file."
            }
          }
          finally {
            Remove-Item Env:OPENHCS_UV_EXECUTABLE -ErrorAction SilentlyContinue
          }
          $summaryJson = python -m scripts.smoke_installed_desktop `
            --platform windows `
            --contract $contractPath `
            --install-root $installRoot `
            --desktop-root $desktopRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Locked-launcher staged update desktop smoke failed."
          }
          Write-Host $summaryJson

      - name: Show Windows installer log on failure
        if: failure() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installerLog = Join-Path `
            ([Environment]::GetFolderPath("LocalApplicationData")) `
            "OpenHCS\installer.log"
          if (Test-Path -LiteralPath $installerLog -PathType Leaf) {
            Write-Host "=== Windows installer log ==="
            Get-Content -LiteralPath $installerLog
          }
          else {
            Write-Host "Windows installer log was not created at '$installerLog'."
          }

          $viewerLogRoot = Join-Path $HOME ".local\share\openhcs\logs"
          if (Test-Path -LiteralPath $viewerLogRoot -PathType Container) {
            Get-ChildItem -LiteralPath $viewerLogRoot -Filter "*_detached_port_*.log" |
              Sort-Object FullName |
              ForEach-Object {
                Write-Host "=== Detached viewer log: $($_.FullName) ==="
                Get-Content -LiteralPath $_.FullName
              }
          }
          else {
            Write-Host "Detached viewer log directory was not created at '$viewerLogRoot'."
          }

      - name: Validate macOS installer sources
        if: matrix.platform == 'macos'
        run: |
          bash -n packaging/installers/macos/install-openhcs.sh
          bash -n packaging/installers/macos/build-installer.sh
          bash -n packaging/installers/macos/dmg-lifecycle.sh
          bash -n packaging/installers/macos/build-dmg.sh
          bash -n packaging/installers/macos/Sign-Installer.sh

      - name: Execute and verify macOS installer
        if: matrix.platform == 'macos'
        run: |
          release_version=$(python scripts/stage_ci_candidate_version.py \
            --run-id "$GITHUB_RUN_ID")
          python -m build --wheel
          staged_contract="$RUNNER_TEMP/installer_contract.json"
          installer_app="$RUNNER_TEMP/OpenHCS Release Installer.app"
          smoke_home="$RUNNER_TEMP/openhcs-installer-home"
          python -m scripts.render_installer_contract \
            --version "$release_version" \
            --output "$staged_contract"
          packaging/installers/macos/build-installer.sh \
            "$staged_contract" \
            "$installer_app"

          installer_dmg="$RUNNER_TEMP/OpenHCS-macOS-Installer.dmg"
          mount_point="$RUNNER_TEMP/OpenHCS Installer Mount"
          mkdir -p "$mount_point"
          packaging/installers/macos/build-dmg.sh \
            "$installer_app" \
            "$installer_dmg"
          source packaging/installers/macos/dmg-lifecycle.sh
          attachment=$(openhcs_attach_readonly_disk_image \
            "$installer_dmg" \
            "$mount_point")
          IFS=$'\t' read -r mounted_device mounted_volume <<< "$attachment"
          cleanup_dmg_mount() {
            if [[ -n "$mounted_device" ]]; then
              openhcs_detach_disk_image \
                "$mounted_device" \
                "$mounted_volume" || true
            fi
          }
          trap cleanup_dmg_mount EXIT
          test -d "$mount_point/OpenHCS Installer.app"
          test -f "$mount_point/.VolumeIcon.icns"
          xcrun GetFileInfo -a "$mount_point" | grep -q C
          openhcs_detach_disk_image "$mounted_device" "$mounted_volume"
          mounted_device=
          mounted_volume=
          trap - EXIT

          mkdir -p "$smoke_home"
          export HOME="$smoke_home"
          export UV_FIND_LINKS="$GITHUB_WORKSPACE/dist"
          export PIP_FIND_LINKS="$UV_FIND_LINKS"
          hostile_pip_index='http://127.0.0.1:9/simple'
          hostile_pip_config="$RUNNER_TEMP/hostile-pip.ini"
          printf '[global]\nindex-url = %s\nextra-index-url = %s\n' \
            "$hostile_pip_index" "$hostile_pip_index" > "$hostile_pip_config"
          export PIP_CONFIG_FILE="$hostile_pip_config"
          export PIP_INDEX_URL="$hostile_pip_index"
          export PIP_EXTRA_INDEX_URL="$hostile_pip_index"
          export PIP_RETRIES=0
          export PIP_TIMEOUT=1
          "$installer_app/Contents/Resources/install-openhcs.sh" \
            "$installer_app/Contents/Resources/installer_contract.json"

          product_name=$(/usr/bin/plutil -extract product_name raw -o - \
            "$staged_contract")
          installer_log="$HOME/Library/Logs/$product_name/installer.log"
          if grep -Fq "$hostile_pip_index" "$installer_log"; then
            printf 'macOS installer inherited a host package index.\n' >&2
            exit 1
          fi
          codex_config="$HOME/.codex/config.toml"
          stable_launcher="$HOME/Library/Application Support/$product_name/current/launch-openhcs.sh"
          python -c "import sys,tomllib; p=tomllib.load(open(sys.argv[1],'rb'))['mcp_servers']['openhcs']; assert p['command']==sys.argv[2]; assert p['args']==['mcp']" \
            "$codex_config" \
            "$stable_launcher"
          python -m scripts.smoke_installed_desktop \
            --platform macos \
            --contract "$staged_contract" \
            --install-root "$HOME/Library/Application Support/$product_name" \
            --home-root "$HOME"

          install_root="$HOME/Library/Application Support/$product_name"
          environment_python="$install_root/current/bin/python"
          app_icon="$HOME/Applications/$product_name.app/Contents/Resources/OpenHCS.icns"
          printf '%s\n' 'stale launcher fixture' > \
            "$install_root/current/launch-openhcs.sh"
          printf '%s\n' 'stale icon fixture' > "$app_icon"
          rm "$HOME/Desktop/$product_name.app"
          export OPENHCS_UV_EXECUTABLE="$install_root/bootstrap/uv/uv"
          "$environment_python" -I -m openhcs.desktop_deployment_cli \
            --installation-pointer="$install_root/current" \
            --json
          python -m scripts.smoke_installed_desktop \
            --platform macos \
            --contract "$staged_contract" \
            --install-root "$install_root" \
            --home-root "$HOME"

          previous_environment=$(readlink "$install_root/current")
          export OPENHCS_UV_EXECUTABLE="$install_root/bootstrap/uv/uv"
          export OPENHCS_MCP_INSTALLATION_POINTER="$install_root/current"
          export OPENHCS_DESKTOP_RESTART_EXECUTABLE="$HOME/Applications/$product_name.app/Contents/MacOS/launch-openhcs"
          managed_python=$("$environment_python" -c 'import sys; print(sys._base_executable)')
          "$managed_python" -c 'import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy()'
          installed_worker=$("$environment_python" -c 'from pathlib import Path; import openhcs.pyqt_gui.services.desktop_update_worker as worker; print(Path(worker.__file__).resolve())')
          "$managed_python" -I "$installed_worker" --help >/dev/null
          "$environment_python" scripts/smoke_staged_desktop_update.py \
            --latest-version "$release_version"
          published_environment=$(readlink "$install_root/current")
          if [[ "$published_environment" == "$previous_environment" ]]; then
            printf 'macOS staged updater did not switch environments.\n' >&2
            exit 1
          fi
          if [[ ! -d "$previous_environment" || ! -d "$published_environment" ]]; then
            printf 'macOS staged updater did not preserve old and new environments.\n' >&2
            exit 1
          fi
          python -m scripts.smoke_installed_desktop \
            --platform macos \
            --contract "$staged_contract" \
            --install-root "$install_root" \
            --home-root "$HOME"

      - name: Show macOS installer log on failure
        if: failure() && matrix.platform == 'macos'
        run: |
          installer_log="$RUNNER_TEMP/openhcs-installer-home/Library/Logs/OpenHCS/installer.log"
          if [[ -f "$installer_log" ]]; then
            printf '%s\n' '=== macOS installer log ==='
            /bin/cat "$installer_log"
          else
            printf 'macOS installer log was not created at %s.\n' "$installer_log"
          fi

  # Wait once for metadata-declared candidate dependencies to reach the same
  # installer-facing index used by pip. Exact-version JSON alone can precede
  # simple-index propagation.
  pypi-dependency-readiness:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    outputs:
      published_wheel_requirements: ${{ steps.dependency_projection.outputs.published_wheel_requirements }}

    steps:
      - name: Checkout candidate package declarations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Fetch candidate release tags
        run: git submodule foreach --recursive git fetch --tags --force

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Wait for installer-visible dependency releases
        id: dependency_projection
        run: |
          python -m pip install packaging
          wheel_requirements_path="$RUNNER_TEMP/openhcs-published-wheels.json"
          python -m scripts.validate_local_release_floors \
            --wait-for-pypi \
            --timeout-seconds 300 \
            --poll-interval-seconds 5 \
            --wheel-requirements-output "$wheel_requirements_path"
          IFS= read -r published_wheel_requirements < "$wheel_requirements_path"
          echo "published_wheel_requirements=$published_wheel_requirements" >> "$GITHUB_OUTPUT"

  # Test PyPI-style installation across Python versions and OSes (6 jobs)
  pypi-installation-test:
    needs: pypi-dependency-readiness
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyQt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/sync_mcp_release_metadata.py --check
          python -m build

      - name: Test headless installation (base - no extras)
        shell: bash
        run: |
          python -m venv test_headless
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_headless/Scripts/activate
            WHEEL=$(ls dist/*.whl)
          else
            source test_headless/bin/activate
            WHEEL=$(ls dist/*.whl)
          fi
          python -m pip install --upgrade pip packaging
          python -m scripts.install_ci_candidate \
            --dependency-source pypi \
            --published-wheel-requirements-json '${{ needs.pypi-dependency-readiness.outputs.published_wheel_requirements }}' \
            --wheel-directory "$RUNNER_TEMP/openhcs-headless-wheel-links" \
            --candidate-wheel "$WHEEL"
          # Verify core OpenHCS works without GUI
          python - <<'PY'
          import openhcs
          from openhcs.core.config import PipelineConfig
          from openhcs.core.pipeline_document import PipelineDocumentAuthority
          from openhcs.core.steps.function_step import FunctionStep

          pipeline_document = PipelineDocumentAuthority.from_values(
              pipeline_config=PipelineConfig(),
              pipeline_steps=[FunctionStep()],
          )
          assert isinstance(pipeline_document.pipeline_config, PipelineConfig)
          assert len(pipeline_document.pipeline_steps) == 1
          assert isinstance(pipeline_document.pipeline_steps[0], FunctionStep)
          print(
              f'[OK] OpenHCS {openhcs.__version__} headless installation OK'
          )
          PY

      - name: Test GUI dependencies installation
        shell: bash
        run: |
          python -m venv test_gui
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_gui/Scripts/activate
            WHEEL=$(ls dist/*.whl)
          else
            source test_gui/bin/activate
            WHEEL=$(ls dist/*.whl)
          fi
          python -m pip install --upgrade pip packaging
          python -m scripts.install_ci_candidate \
            --dependency-source pypi \
            --published-wheel-requirements-json '${{ needs.pypi-dependency-readiness.outputs.published_wheel_requirements }}' \
            --wheel-directory "$RUNNER_TEMP/openhcs-gui-wheel-links" \
            --candidate-wheel "$WHEEL" \
            --extras gui
          # Verify the GUI dependency set before the combined entrypoint smoke below.
          python -c "import openhcs; import psutil; import GPUtil; print(f'[OK] OpenHCS {openhcs.__version__} GUI dependencies installed')"

      - name: Test dev dependencies installation
        shell: bash
        run: |
          python -m venv test_dev
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_dev/Scripts/activate
            WHEEL=$(ls dist/*.whl)
          else
            source test_dev/bin/activate
            WHEEL=$(ls dist/*.whl)
          fi
          python -m pip install --upgrade pip packaging
          python -m scripts.install_ci_candidate \
            --dependency-source pypi \
            --published-wheel-requirements-json '${{ needs.pypi-dependency-readiness.outputs.published_wheel_requirements }}' \
            --wheel-directory "$RUNNER_TEMP/openhcs-dev-wheel-links" \
            --candidate-wheel "$WHEEL" \
            --extras dev
          python -c "import pytest; import openhcs; print('[OK] Dev dependencies OK')"

      - name: Test declared desktop MCP installation outside checkout
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          XDG_CACHE_HOME: ${{ runner.temp }}/openhcs-mcp-cache
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_gui/Scripts/activate
          else
            source test_gui/bin/activate
          fi
          WHEEL=$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")
          DESKTOP_EXTRAS=$(python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --print-desktop-extras)
          python -m scripts.install_ci_candidate \
            --dependency-source pypi \
            --published-wheel-requirements-json '${{ needs.pypi-dependency-readiness.outputs.published_wheel_requirements }}' \
            --wheel-directory "$RUNNER_TEMP/openhcs-desktop-wheel-links" \
            --candidate-wheel "$WHEEL" \
            --extras "$DESKTOP_EXTRAS"
          python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --check --capability-requirements
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_mcp.py" --forbid-import-root "$GITHUB_WORKSPACE"

      - name: Test installed GUI and live MCP outside checkout
        shell: bash
        env:
          OPENHCS_CPU_ONLY: true
          XDG_CACHE_HOME: ${{ runner.temp }}/openhcs-gui-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/openhcs-gui-config
          XDG_DATA_HOME: ${{ runner.temp }}/openhcs-gui-data
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source test_gui/Scripts/activate
          else
            source test_gui/bin/activate
          fi
          if [ "$RUNNER_OS" == "Linux" ]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_gui.py" \
            --forbid-import-root "$GITHUB_WORKSPACE"

  # Run the real 30-case headless comparator once. The cross-OS/Python matrix
  # above owns generated public-boundary coverage; this lane owns semantic
  # parity against committed native CellProfiler outputs.
  official30-headless-parity:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    env:
      OPENHCS_CP_NATIVE_REFERENCE_ROOT: ${{ github.workspace }}/benchmark/native_refs/official30_scoped_rows
      OPENHCS_CPU_ONLY: true
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Build and install the Official30 candidate wheels
        run: |
          python -m pip install --upgrade pip build
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,cellprofiler-compat

      - name: Configure deterministic NumPy dispatch
        run: |
          python - <<'PY'
          import os

          from benchmark.adapters.cellprofiler import (
              DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES,
              NUMPY_DISABLED_CPU_FEATURES_ENV,
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"{NUMPY_DISABLED_CPU_FEATURES_ENV}="
                  f"{DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES}\n"
              )
          PY

      - name: Materialize manifest-pinned Official30 inputs
        env:
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30/datasets
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          from benchmark.cellprofiler_comparison import load_comparison_cases

          manifest_path = Path(
              "benchmark/manifests/official30_portable_axis1.json"
          )
          cases = load_comparison_cases(manifest_path)
          if len(cases) != 30:
              raise RuntimeError(
                  f"Official30 manifest resolved {len(cases)} cases, expected 30."
              )
          missing = tuple(
              (case.name, path)
              for case in cases
              for path in (case.dataset_path, case.cppipe_path)
              if not path.exists()
          )
          if missing:
              raise FileNotFoundError(
                  f"Official30 acquisition left missing inputs: {missing!r}"
              )
          print("Materialized 30 manifest-owned Official30 cases.")
          PY

      - name: Run all 30 headless parity cases over ZMQ
        env:
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30/datasets
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "0"
        run: |
          python scripts/run_installed_tests.py --repo-root "$GITHUB_WORKSPACE" -- \
            tests/integration/test_cellprofiler_official30_zmq.py::test_official30_compile_execute_and_match_native_references_over_zmq \
            --basetemp "$RUNNER_TEMP/openhcs-official30/pytest" \
            -v \
            --tb=short

      - name: Upload per-case Official30 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official30-headless-parity
          path: |
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/observations.jsonl
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/observations.csv
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/phase_timing.csv
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/summary.csv
            ${{ runner.temp }}/openhcs-official30/pytest/**/baseline/suite_metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ZMQ logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official30-headless-zmq-logs
          path: |
            ~/.local/share/openhcs/logs
            ~/.local/state/openhcs/logs
          if-no-files-found: warn
          retention-days: 14

  # Exercise the real Fiji and Napari process boundaries once against a
  # manifest-owned Official30 case. Java 26 is intentional: the process owner
  # must select its compatible managed runtime instead of accepting this JVM.
  official30-real-viewer-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      OPENHCS_CP_NATIVE_REFERENCE_ROOT: ${{ github.workspace }}/benchmark/native_refs/official30_scoped_rows
      OPENHCS_CPU_ONLY: true
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: xcb

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Expose incompatible system Java 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "26"

      - name: Confirm system Java failure boundary
        run: |
          python - <<'PY'
          import re
          import subprocess

          completed = subprocess.run(
              ["java", "-XshowSettings:properties", "-version"],
              check=True,
              capture_output=True,
              text=True,
          )
          output = completed.stdout + completed.stderr
          print(output)
          match = re.search(r"^\s*java\.version\s*=\s*(\d+)", output, re.MULTILINE)
          if match is None or int(match.group(1)) != 26:
              raise RuntimeError(
                  "The real-viewer regression must expose Java 26 as the "
                  f"system JVM; observed output:\n{output}"
              )
          PY

      - name: Install graphical runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libopengl0 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxrender1 \
            libxtst6 \
            xvfb

      - name: Build and install the real-viewer candidate wheels
        run: |
          python -m pip install --upgrade pip build
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras dev,gui,viz,cellprofiler-compat

      - name: Verify native Qt xcb runtime
        run: |
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            python - <<'PY'
          import os

          import cv2
          from qtpy.QtCore import QLibraryInfo
          from qtpy.QtWidgets import QApplication

          from openhcs.runtime.viewer_protocol import ViewerQtEnvironmentPolicy

          del cv2
          ViewerQtEnvironmentPolicy().apply_to(os.environ)
          plugin_path = QLibraryInfo.path(
              QLibraryInfo.LibraryPath.PluginsPath
          )
          if os.environ.get("QT_QPA_PLATFORM_PLUGIN_PATH") != plugin_path:
              raise RuntimeError(
                  "Viewer Qt policy did not select the active binding's "
                  f"plugin directory: {plugin_path}"
              )
          application = QApplication([])
          application.processEvents()
          print(f"Native Qt xcb runtime ready with plugins at {plugin_path}.")
          PY

      - name: Cache managed Java and ImageJ artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/cjdk
            ~/.jgo
            ~/.m2/repository
          key: ${{ runner.os }}-openhcs-fiji-${{ hashFiles('pyproject.toml') }}

      - name: Prewarm managed Fiji runtime
        run: |
          python - <<'PY'
          import imagej
          import scyjava as sj
          from polystore.imagej_runtime import FIJI_IMAGEJ_RUNTIME

          ij = FIJI_IMAGEJ_RUNTIME.initialize(
              imagej,
              sj,
              mode="headless",
          )
          try:
              java_version = str(
                  sj.jimport("java.lang.System").getProperty("java.version")
              )
              print(
                  "Prewarmed the managed Fiji runtime with Java "
                  f"{java_version}."
              )
          finally:
              FIJI_IMAGEJ_RUNTIME.shutdown(ij, sj)
          PY

      - name: Run real Bio-Formats ImageXpress source smoke
        run: |
          for smoke_attempt in 1 2 3; do
            printf 'Bio-Formats process-exit smoke %s/3\n' "$smoke_attempt"
            python scripts/run_installed_tests.py --repo-root "$GITHUB_WORKSPACE" -- \
              tests/integration/test_bioformats_imagexpress_synthetic.py \
              -v --tb=short
          done

      - name: Configure deterministic NumPy dispatch
        run: |
          python - <<'PY'
          import os

          from benchmark.adapters.cellprofiler import (
              DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES,
              NUMPY_DISABLED_CPU_FEATURES_ENV,
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"{NUMPY_DISABLED_CPU_FEATURES_ENV}="
                  f"{DETERMINISTIC_NUMPY_DISABLED_CPU_FEATURES}\n"
              )
          PY

      - name: Materialize manifest-pinned Official30 inputs
        env:
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30-viewers/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30-viewers/datasets
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          from benchmark.cellprofiler_comparison import load_comparison_cases

          manifest_path = Path(
              "benchmark/manifests/official30_portable_axis1.json"
          )
          cases = load_comparison_cases(manifest_path)
          if len(cases) != 30:
              raise RuntimeError(
                  f"Official30 manifest resolved {len(cases)} cases, expected 30."
              )
          missing = tuple(
              (case.name, path)
              for case in cases
              for path in (case.dataset_path, case.cppipe_path)
              if not path.exists()
          )
          if missing:
              raise FileNotFoundError(
                  f"Official30 acquisition left missing inputs: {missing!r}"
              )
          print("Materialized 30 manifest-owned Official30 cases.")
          PY

      - name: Run Fiji and Fiji plus Napari real-viewer smokes
        env:
          CELLPROFILER_EXAMPLES_ROOT: ${{ runner.temp }}/openhcs-official30-viewers/cellprofiler-examples
          OPENHCS_BENCHMARK_DATASET_CACHE_ROOT: ${{ runner.temp }}/openhcs-official30-viewers/datasets
          OPENHCS_BENCHMARK_AUTO_ACQUIRE: "0"
        run: |
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            python scripts/run_installed_tests.py --repo-root "$GITHUB_WORKSPACE" -- \
            'tests/integration/test_cellprofiler_official30_zmq.py::test_official30_persistent_fiji_variants_isolated_per_case[fiji-00-ExampleColocalization]' \
            'tests/integration/test_cellprofiler_official30_zmq.py::test_official30_persistent_fiji_variants_isolated_per_case[fiji+napari-00-ExampleColocalization]' \
            --basetemp "$RUNNER_TEMP/openhcs-official30-viewers/pytest" \
            -v \
            --tb=short

      - name: Upload viewer smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official30-real-viewer-smoke
          path: |
            ${{ runner.temp }}/openhcs-official30-viewers/pytest/**/summary.csv
            ${{ runner.temp }}/openhcs-official30-viewers/pytest/**/observations.jsonl
            ${{ runner.temp }}/openhcs-official30-viewers/pytest/**/observations.csv
            ${{ runner.temp }}/openhcs-official30-viewers/pytest/**/suite_metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload viewer and ZMQ logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official30-real-viewer-zmq-logs
          path: |
            ~/.local/share/openhcs/logs
            ~/.local/state/openhcs/logs
          if-no-files-found: warn
          retention-days: 14

  # Run integration tests against wheel installation
  wheel-integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    env:
      OPENHCS_CPU_ONLY: true
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          # PyQt6 requires libEGL.so.1 (EGL) and libGL.so.1 (OpenGL).
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 xvfb

      - name: Install candidate wheel and run integration tests
        run: |
          python -m venv test_wheel
          source test_wheel/bin/activate
          python -m pip install --upgrade pip build
          desktop_extras=$(python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --print-desktop-extras)
          python -m scripts.install_ci_candidate \
            --dependency-source submodules \
            --wheel-directory "$RUNNER_TEMP/openhcs-candidate-wheels" \
            --extras "dev,dev-gui,cellprofiler-compat,$desktop_extras" \
            --requirement pytest-split==0.11.0
          XDG_CACHE_HOME="$RUNNER_TEMP/openhcs-live-mcp-cache" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/openhcs-live-mcp-config" \
          XDG_DATA_HOME="$RUNNER_TEMP/openhcs-live-mcp-data" \
            python -I "$GITHUB_WORKSPACE/scripts/smoke_installed_gui.py" \
              --forbid-import-root "$GITHUB_WORKSPACE"
          python scripts/run_installed_tests.py --repo-root "$GITHUB_WORKSPACE" -- \
            tests/unit/pyqt_gui/test_progress_tree_aggregation.py -q
          for group in 1 2 3 4 5 6; do
            coverage_flag="--cov-report="
            if [ "$group" != "1" ]; then coverage_flag="--cov-append --cov-report="; fi
            python scripts/run_installed_tests.py --coverage --repo-root "$GITHUB_WORKSPACE" -- \
              tests/integration/test_cellprofiler_generated_pipeline.py \
              --splits 6 --group "$group" $coverage_flag \
              --it-backends disk --it-microscopes ImageXpress --it-dims 3d \
              --it-exec-mode multiprocessing --it-zmq-mode zmq \
              --it-visualizers none -v --tb=short
          done
          python scripts/run_installed_tests.py --coverage --repo-root "$GITHUB_WORKSPACE" -- \
            tests/integration/ \
            --ignore=tests/integration/test_cellprofiler_generated_pipeline.py \
            --cov-append --cov-report=term --it-backends disk \
            --it-microscopes ImageXpress --it-dims 3d \
            --it-exec-mode multiprocessing --it-zmq-mode zmq \
            --it-visualizers none -v --tb=short
          cp .coverage .coverage.wheel
          deactivate

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-wheel-integration
          path: .coverage.wheel
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

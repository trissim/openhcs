name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: "OpenHCS version to publish or register"
        required: true
        type: string
      publish_python_package:
        description: "Publish the Python package before registering it"
        required: true
        default: false
        type: boolean
      publish_desktop_installers:
        description: "Build installers and attach them to the existing version tag"
        required: true
        default: false
        type: boolean

jobs:
  verify-release-commit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.release_version) || github.ref }}

      - name: Resolve the immutable release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="v${{ inputs.release_version }}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ $(git cat-file -t "refs/tags/$release_tag") != tag ]]; then
            printf 'Release ref %s is not an annotated tag.\n' "$release_tag" >&2
            exit 1
          fi
          release_sha=$(git rev-list -n 1 "refs/tags/$release_tag")
          if [[ $(git rev-parse HEAD) != "$release_sha" ]]; then
            printf 'Checked-out commit does not match %s.\n' "$release_tag" >&2
            exit 1
          fi
          release_version=${release_tag#v}
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact-commit release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install packaging requests
          python scripts/sync_mcp_release_metadata.py \
            --check \
            --expected-version "${{ steps.release.outputs.release_version }}"
          python -m scripts.release_readiness \
            --repository "$GITHUB_REPOSITORY" \
            --commit "${{ steps.release.outputs.release_sha }}"

  build-windows-installer:
    needs: verify-release-commit
    if: github.event_name == 'push' || inputs.publish_desktop_installers
    runs-on: ${{ vars.OPENHCS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT != '' && fromJSON('["self-hosted","windows","x64","openhcs-signing"]') || 'windows-latest' }}
    timeout-minutes: 30
    env:
      OPENHCS_RELEASE_VERSION: ${{ needs.verify-release-commit.outputs.release_version }}
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-commit.outputs.release_sha }}
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up installer compiler
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Validate installer contract and sources
        shell: pwsh
        run: |
          python -m pip install packaging pytest
          python -m pytest -q -c tests/installer/pytest.ini tests/installer
          $source = Get-Content packaging/installers/windows/Install-OpenHCS.ps1 -Raw
          [void][scriptblock]::Create($source)
          $signingSource = Get-Content packaging/installers/windows/Sign-Installer.ps1 -Raw
          [void][scriptblock]::Create($signingSource)

      - name: Build release-pinned single-file Windows installer
        shell: pwsh
        run: |
          $releaseVersion = $env:OPENHCS_RELEASE_VERSION -replace '^v', ''
          $contractPath = Join-Path $env:RUNNER_TEMP "installer_contract.json"
          python -m scripts.render_installer_contract `
            --version $releaseVersion `
            --output $contractPath
          & packaging/installers/windows/Build-InstallerLauncher.ps1 `
            -OutputDirectory $env:GITHUB_WORKSPACE `
            -ContractPath $contractPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows GUI installer launcher build failed."
          }
          $launcher = Join-Path $env:GITHUB_WORKSPACE "OpenHCS-Windows-Installer.exe"
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "Single-file Windows GUI installer was not staged."
          }
          $subsystem = python -c "import struct,sys; from pathlib import Path; data=Path(sys.argv[1]).read_bytes(); pe=struct.unpack_from('<I',data,0x3c)[0]; assert data[pe:pe+4]==b'PE\0\0'; print(struct.unpack_from('<H',data,pe+24+68)[0])" $launcher
          if ($subsystem.Trim() -ne "2") {
            throw "Windows installer launcher is not a GUI-subsystem executable."
          }
          if ((Get-Item -LiteralPath $launcher).Length -gt 2MB) {
            throw "Windows installer launcher unexpectedly embeds a large runtime."
          }

      - name: Sign and verify Windows installer
        if: vars.OPENHCS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        timeout-minutes: 5
        env:
          OPENHCS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.OPENHCS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          & packaging/installers/windows/Sign-Installer.ps1 `
            -ArtifactPath "$env:GITHUB_WORKSPACE/OpenHCS-Windows-Installer.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer signing or verification failed."
          }

      - name: Disclose unsigned Windows installer
        if: vars.OPENHCS_WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT == ''
        shell: pwsh
        run: |
          Write-Warning "Publishing an unsigned Windows installer because no signing certificate thumbprint is configured."
          "### Windows installer trust`n`nUnsigned: no Authenticode certificate is configured." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload single-file Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openhcs-windows-installer
          path: OpenHCS-Windows-Installer.exe
          if-no-files-found: error

  build-macos-installer:
    needs: verify-release-commit
    if: github.event_name == 'push' || inputs.publish_desktop_installers
    runs-on: macos-latest
    env:
      OPENHCS_RELEASE_VERSION: ${{ needs.verify-release-commit.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-commit.outputs.release_sha }}
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate installer contract and sources
        run: |
          python -m pip install packaging pytest
          python -m pytest -q -c tests/installer/pytest.ini tests/installer
          bash -n packaging/installers/macos/install-openhcs.sh
          bash -n packaging/installers/macos/build-installer.sh
          bash -n packaging/installers/macos/Sign-Installer.sh

      - name: Resolve macOS installer trust mode
        id: installer-trust
        env:
          OPENHCS_MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OPENHCS_MACOS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if [[ -n "$OPENHCS_MACOS_SIGNING_CERTIFICATE_BASE64" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release-pinned macOS installer application
        run: |
          STAGE="$RUNNER_TEMP/OpenHCS-macOS-Installer"
          mkdir -p "$STAGE"
          python -m scripts.render_installer_contract \
            --version "${OPENHCS_RELEASE_VERSION#v}" \
            --output "$STAGE/installer_contract.json"
          packaging/installers/macos/build-installer.sh \
            "$STAGE/installer_contract.json" \
            "$STAGE/OpenHCS Installer.app"

      - name: Sign and verify macOS installer application
        if: steps.installer-trust.outputs.mode == 'signed'
        env:
          OPENHCS_MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OPENHCS_MACOS_SIGNING_CERTIFICATE_BASE64 }}
          OPENHCS_MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OPENHCS_MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          OPENHCS_MACOS_DEVELOPER_IDENTITY: ${{ secrets.OPENHCS_MACOS_DEVELOPER_IDENTITY }}
        run: |
          STAGE="$RUNNER_TEMP/OpenHCS-macOS-Installer"
          packaging/installers/macos/Sign-Installer.sh \
            sign-app \
            "$STAGE/OpenHCS Installer.app"

      - name: Build release-pinned macOS installer disk image
        run: |
          STAGE="$RUNNER_TEMP/OpenHCS-macOS-Installer"
          if [[ "${{ steps.installer-trust.outputs.mode }}" == "signed" ]]; then
            codesign \
              --verify \
              --deep \
              --strict \
              --verbose=2 \
              "$STAGE/OpenHCS Installer.app"
          fi
          packaging/installers/macos/build-dmg.sh \
            "$STAGE/OpenHCS Installer.app" \
            "$GITHUB_WORKSPACE/OpenHCS-macOS-Installer.dmg"

      - name: Sign, notarize, and verify macOS installer disk image
        if: steps.installer-trust.outputs.mode == 'signed'
        env:
          OPENHCS_MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OPENHCS_MACOS_SIGNING_CERTIFICATE_BASE64 }}
          OPENHCS_MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OPENHCS_MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          OPENHCS_MACOS_DEVELOPER_IDENTITY: ${{ secrets.OPENHCS_MACOS_DEVELOPER_IDENTITY }}
          OPENHCS_MACOS_NOTARY_KEY_BASE64: ${{ secrets.OPENHCS_MACOS_NOTARY_KEY_BASE64 }}
          OPENHCS_MACOS_NOTARY_KEY_ID: ${{ secrets.OPENHCS_MACOS_NOTARY_KEY_ID }}
          OPENHCS_MACOS_NOTARY_ISSUER_ID: ${{ secrets.OPENHCS_MACOS_NOTARY_ISSUER_ID }}
        run: |
          packaging/installers/macos/Sign-Installer.sh \
            sign-dmg-and-notarize \
            "$GITHUB_WORKSPACE/OpenHCS-macOS-Installer.dmg"

      - name: Disclose unsigned macOS installer
        if: steps.installer-trust.outputs.mode == 'unsigned'
        run: |
          echo "::warning::Publishing an unsigned macOS installer because no Developer ID certificate is configured."
          {
            echo "### macOS installer trust"
            echo
            echo "Unsigned and not notarized: no Developer ID certificate is configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS installer disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openhcs-macos-installer
          path: OpenHCS-macOS-Installer.dmg
          if-no-files-found: error

  build-and-publish:
    needs: [verify-release-commit, build-windows-installer, build-macos-installer]
    if: >-
      always() &&
      needs.verify-release-commit.result == 'success' &&
      ((github.event_name == 'push' &&
      needs.build-windows-installer.result == 'success' &&
      needs.build-macos-installer.result == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.publish_python_package))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENHCS_RELEASE_VERSION: ${{ needs.verify-release-commit.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-commit.outputs.release_sha }}
          submodules: recursive

      - name: Fetch submodule release tags
        run: git submodule foreach --recursive git fetch --tags --force

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyQt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
          sudo apt-get install -y libegl1 || sudo apt-get install -y libegl1-mesa
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Validate release version and generated MCP metadata
        run: |
          python scripts/sync_mcp_release_metadata.py --check --expected-version "${OPENHCS_RELEASE_VERSION#v}"
          python -m scripts.validate_local_release_floors
          MCP_REGISTRY_SCHEMA=$(python -c 'import json; print(json.load(open("server.json"))["$schema"])')
          check-jsonschema --no-cache --schemafile "$MCP_REGISTRY_SCHEMA" server.json

      - name: Build package
        run: |
          python -m build
          python -m scripts.validate_wheel_deployment dist/*.whl

      - name: Smoke-test installed desktop wheel outside checkout
        env:
          OPENHCS_CPU_ONLY: true
          QT_QPA_PLATFORM: offscreen
          XDG_CACHE_HOME: ${{ runner.temp }}/openhcs-mcp-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/openhcs-gui-config
          XDG_DATA_HOME: ${{ runner.temp }}/openhcs-gui-data
        run: |
          DESKTOP_EXTRAS=$(python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --print-desktop-extras)
          WHEEL=$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")
          python -m venv mcp_release_smoke
          source mcp_release_smoke/bin/activate
          pip install "${WHEEL}[${DESKTOP_EXTRAS}]"
          python "$GITHUB_WORKSPACE/scripts/sync_mcp_release_metadata.py" --check --capability-requirements --expected-version "${OPENHCS_RELEASE_VERSION#v}"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_mcp.py" --forbid-import-root "$GITHUB_WORKSPACE"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_gui.py" \
            --forbid-import-root "$GITHUB_WORKSPACE" \
            --evidence-directory "$RUNNER_TEMP/openhcs-release-gui-evidence"
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine check dist/*
          twine upload dist/*

      - name: Download desktop installers
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openhcs-*-installer
          path: installer-assets
          merge-multiple: true

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
            installer-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-installer-recovery-release:
    needs: [verify-release-commit, build-windows-installer, build-macos-installer]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_desktop_installers &&
      needs.build-windows-installer.result == 'success' &&
      needs.build-macos-installer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openhcs-*-installer
          path: installer-assets
          merge-multiple: true

      - name: Create or update installer release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.verify-release-commit.outputs.release_tag }}
          files: installer-assets/*
          generate_release_notes: true
          body: >-
            Native installer signing is opportunistic during the current
            bootstrap period. Assets are signed and verified when publisher
            credentials are configured; otherwise the workflow publishes
            visibly disclosed unsigned installers rather than withholding
            native downloads.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    needs: [verify-release-commit, build-and-publish]
    if: >-
      always() &&
      (needs.build-and-publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' &&
      !inputs.publish_python_package &&
      !inputs.publish_desktop_installers)) &&
      needs.verify-release-commit.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OPENHCS_RELEASE_VERSION: ${{ needs.verify-release-commit.outputs.release_version }}
      MCP_PUBLISHER_VERSION: v1.7.9
      MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-commit.outputs.release_sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release tag and generated MCP metadata
        run: |
          python -m pip install packaging
          python scripts/sync_mcp_release_metadata.py --check --expected-version "${OPENHCS_RELEASE_VERSION#v}"

      - name: Wait for the published PyPI release
        run: |
          MCP_PYPI_PROJECT=$(python -c 'import json; print(next(package["identifier"] for package in json.load(open("server.json"))["packages"] if package["registryType"] == "pypi"))')
          python scripts/wait_for_pypi_release.py \
            "$MCP_PYPI_PROJECT" "${OPENHCS_RELEASE_VERSION#v}" \
            --timeout-seconds 900 \
            --poll-interval-seconds 5 \
            --wheel-url-output "$RUNNER_TEMP/openhcs-release-wheel-url"

      - name: Validate published desktop capability requirements
        run: |
          MCP_PYPI_PROJECT=$(python -c 'import json; print(next(package["identifier"] for package in json.load(open("server.json"))["packages"] if package["registryType"] == "pypi"))')
          DESKTOP_EXTRAS=$(python scripts/sync_mcp_release_metadata.py --print-desktop-extras)
          MCP_WHEEL_URL=$(< "$RUNNER_TEMP/openhcs-release-wheel-url")
          python -m pip install "${MCP_PYPI_PROJECT}[${DESKTOP_EXTRAS}] @ ${MCP_WHEEL_URL}"
          python scripts/sync_mcp_release_metadata.py --check --capability-requirements --expected-version "${OPENHCS_RELEASE_VERSION#v}"

      - name: Validate official MCP Registry metadata
        run: |
          MCP_PUBLISHER_ARCHIVE="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --output "$MCP_PUBLISHER_ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_LINUX_AMD64_SHA256  $MCP_PUBLISHER_ARCHIVE" | sha256sum --check
          tar --extract --gzip --file "$MCP_PUBLISHER_ARCHIVE" \
            --directory "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate

      - name: Publish to the official MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

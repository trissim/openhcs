name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate installer contract and sources
        shell: pwsh
        run: |
          python -m pip install packaging pytest
          python -m pytest -q -c tests/installer/pytest.ini tests/installer
          $source = Get-Content packaging/installers/windows/Install-OpenHCS.ps1 -Raw
          [void][scriptblock]::Create($source)

      - name: Build release-pinned Windows installer archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "OpenHCS-Windows-Installer"
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item packaging/installers/windows/* -Destination $stage
          python scripts/render_installer_contract.py `
            --version $releaseVersion `
            --output (Join-Path $stage "installer_contract.json")
          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath OpenHCS-Windows-Installer.zip

      - name: Upload Windows installer archive
        uses: actions/upload-artifact@v4
        with:
          name: openhcs-windows-installer
          path: OpenHCS-Windows-Installer.zip
          if-no-files-found: error

  build-macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate installer contract and sources
        run: |
          python -m pip install packaging pytest
          python -m pytest -q -c tests/installer/pytest.ini tests/installer
          bash -n packaging/installers/macos/install-openhcs.sh
          bash -n packaging/installers/macos/build-installer.sh

      - name: Build release-pinned macOS installer archive
        run: |
          STAGE="$RUNNER_TEMP/OpenHCS-macOS-Installer"
          mkdir -p "$STAGE"
          python scripts/render_installer_contract.py \
            --version "${GITHUB_REF_NAME#v}" \
            --output "$STAGE/installer_contract.json"
          packaging/installers/macos/build-installer.sh \
            "$STAGE/installer_contract.json" \
            "$STAGE/OpenHCS Installer.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$STAGE/OpenHCS Installer.app" \
            "$GITHUB_WORKSPACE/OpenHCS-macOS-Installer.zip"

      - name: Upload macOS installer archive
        uses: actions/upload-artifact@v4
        with:
          name: openhcs-macos-installer
          path: OpenHCS-macOS-Installer.zip
          if-no-files-found: error

  build-and-publish:
    needs: [build-windows-installer, build-macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine packaging check-jsonschema

      - name: Validate release tag and generated MCP metadata
        run: |
          python scripts/sync_mcp_release_metadata.py --check --expected-version "${GITHUB_REF_NAME#v}"
          python scripts/validate_local_release_floors.py
          MCP_REGISTRY_SCHEMA=$(python -c 'import json; print(json.load(open("server.json"))["$schema"])')
          check-jsonschema --no-cache --schemafile "$MCP_REGISTRY_SCHEMA" server.json

      - name: Build package
        run: python -m build

      - name: Smoke-test installed MCP wheel outside checkout
        env:
          OPENHCS_CPU_ONLY: true
          XDG_CACHE_HOME: ${{ runner.temp }}/openhcs-mcp-cache
        run: |
          python -m venv mcp_release_smoke
          source mcp_release_smoke/bin/activate
          WHEEL=$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve())")
          pip install "${WHEEL}[gui,mcp]"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_mcp.py" --forbid-import-root "$GITHUB_WORKSPACE"
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine check dist/*
          twine upload dist/* --skip-existing

      - name: Download desktop installer archives
        uses: actions/download-artifact@v4
        with:
          pattern: openhcs-*-installer
          path: installer-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
            installer-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.7.9
      MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag and generated MCP metadata
        run: |
          python -m pip install packaging
          python scripts/sync_mcp_release_metadata.py --check --expected-version "${GITHUB_REF_NAME#v}"

      - name: Wait for the published PyPI release
        run: |
          MCP_PYPI_PROJECT=$(python -c 'import json; print(next(package["identifier"] for package in json.load(open("server.json"))["packages"] if package["registryType"] == "pypi"))')
          python scripts/wait_for_pypi_release.py \
            "$MCP_PYPI_PROJECT" "${GITHUB_REF_NAME#v}" \
            --timeout-seconds 900 \
            --poll-interval-seconds 5

      - name: Validate official MCP Registry metadata
        run: |
          MCP_PUBLISHER_ARCHIVE="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --output "$MCP_PUBLISHER_ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_LINUX_AMD64_SHA256  $MCP_PUBLISHER_ARCHIVE" | sha256sum --check
          tar --extract --gzip --file "$MCP_PUBLISHER_ARCHIVE" \
            --directory "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" validate

      - name: Publish to the official MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

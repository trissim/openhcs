name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - "openhcs/resources/assets/openhcs-*.svg"
      - "docs/source/_static/ui.png"
      - "scripts/build_website.py"
      - "scripts/capture_media_gallery.py"
      - "scripts/gallery_catalog.py"
      - "scripts/website_gallery_projection.py"
      - "scripts/validate_local_release_floors.py"
      - "docs/media_gallery_capture.md"
      - "tests/unit/test_build_website.py"
      - "tests/unit/test_capture_media_gallery.py"
      - "openhcs/__init__.py"
      - "pyproject.toml"
      - ".github/workflows/website-pages.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "openhcs/resources/assets/openhcs-*.svg"
      - "docs/source/_static/ui.png"
      - "scripts/build_website.py"
      - "scripts/capture_media_gallery.py"
      - "scripts/gallery_catalog.py"
      - "scripts/website_gallery_projection.py"
      - "scripts/validate_local_release_floors.py"
      - "docs/media_gallery_capture.md"
      - "tests/unit/test_build_website.py"
      - "tests/unit/test_capture_media_gallery.py"
      - "openhcs/__init__.py"
      - "pyproject.toml"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install website test dependencies
        run: |
          python -m pip install pytest
          mapfile -t local_project_paths < <(
            python - <<'PY'
          from pathlib import Path

          from packaging.utils import canonicalize_name

          from scripts.validate_local_release_floors import (
              discover_local_projects,
              read_project,
          )

          project = read_project(Path("pyproject.toml"))
          required_names = {
              canonicalize_name(name)
              for name in ("python-introspect", "metaclass-registry")
          }
          declared_names = {
              canonicalize_name(requirement.name)
              for requirement in project.dependencies
          }
          undeclared_names = required_names - declared_names
          if undeclared_names:
              raise SystemExit(
                  "Missing website dependencies in project metadata: "
                  + ", ".join(sorted(undeclared_names))
              )
          local_projects = {
              candidate.canonical_name: candidate
              for candidate in discover_local_projects()
          }
          missing_sources = required_names - local_projects.keys()
          if missing_sources:
              raise SystemExit(
                  "Missing website dependency submodules: "
                  + ", ".join(sorted(missing_sources))
              )
          print(
              *(local_projects[name].path.parent for name in sorted(required_names)),
              sep="\n",
          )
          PY
          )
          python -m pip install "${local_project_paths[@]}"

      - name: Test, build, and validate landing page
        run: |
          python -m scripts.gallery_catalog --check
          python -m pytest -q --confcutdir=tests/unit tests/unit/test_build_website.py
          python -m scripts.build_website --output _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build landing page artifact
        run: python -m scripts.build_website --output _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - "openhcs/resources/assets/openhcs-*.svg"
      - "docs/source/_static/ui.png"
      - "scripts/build_website.py"
      - "scripts/capture_media_gallery.py"
      - "scripts/gallery_catalog.py"
      - "scripts/website_gallery_projection.py"
      - "docs/media_gallery_capture.md"
      - "tests/unit/test_build_website.py"
      - "tests/unit/test_capture_media_gallery.py"
      - "openhcs/__init__.py"
      - ".github/workflows/website-pages.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "openhcs/resources/assets/openhcs-*.svg"
      - "docs/source/_static/ui.png"
      - "scripts/build_website.py"
      - "scripts/capture_media_gallery.py"
      - "scripts/gallery_catalog.py"
      - "scripts/website_gallery_projection.py"
      - "docs/media_gallery_capture.md"
      - "tests/unit/test_build_website.py"
      - "tests/unit/test_capture_media_gallery.py"
      - "openhcs/__init__.py"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install website test dependency
        run: >-
          python -m pip install pytest
          "python-introspect>=0.1.11"
          "metaclass-registry>=0.2.0,<0.3"

      - name: Test, build, and validate landing page
        run: |
          python -m scripts.gallery_catalog --check
          python -m pytest -q --confcutdir=tests/unit tests/unit/test_build_website.py
          python -m scripts.build_website --output _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build landing page artifact
        run: python -m scripts.build_website --output _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

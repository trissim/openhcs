x-openhcs-connection:
  host: "localhost"
  port: &openhcs-omero-port 4064
  web_port: &openhcs-omero-web-port 4080
  user: "root"
  password: &openhcs-omero-password "openhcs"

services:

  database:
    # Pin the tested database release so a cold installation cannot silently
    # acquire a different server stack from the same compose declaration.
    image: "postgres:16.15"
    environment:
      POSTGRES_USER: omero
      POSTGRES_DB: omero
      POSTGRES_PASSWORD: omero
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - omero
    volumes:
      - "database:/var/lib/postgresql/data"

  omeroserver:
    # OMERO.server components start independently. Keep the validated release
    # explicit and upgrade it through the integration suite.
    image: "openmicroscopy/omero-server:5.6.18"
    environment:
      CONFIG_omero_db_host: database
      CONFIG_omero_db_user: omero
      CONFIG_omero_db_pass: omero
      CONFIG_omero_db_name: omero
      ROOTPASS: *openhcs-omero-password
    networks:
      - omero
    ports:
      - "4063:4063"
      - target: 4064
        published: *openhcs-omero-port
    volumes:
      - "omero:/OMERO"
    ulimits:
      nofile:
        soft: 8192
        hard: 65536

  omeroweb:
    # Keep the local viewing service reproducible without exposing the alpha
    # OpenHCS web panel as a supported execution entry point.
    image: "openmicroscopy/omero-web-standalone:5.33.0"
    environment:
      OMEROHOST: omeroserver
    networks:
      - omero
    ports:
      - target: 4080
        published: *openhcs-omero-web-port
    depends_on:
      - omeroserver

networks:
  omero:

volumes:
  database:
  omero:
